<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DOORS 6</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    }
    body {
      overflow: hidden;
      background-color: #06070b;
      color: #f1f5f9;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 어두운 시야 비네트 */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
      z-index: 5;
      transition: background 0.2s;
    }
    #vignette.anomaly {
      background: radial-gradient(circle at center, rgba(120, 10, 30, 0.15) 28%, rgba(30, 0, 10, 0.96) 100%);
    }

    /* 시작 화면 (불필요한 글씨 모두 제거) */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at 50% 35%, #19162e 0%, #06070b 82%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .panel {
      background: rgba(14, 16, 26, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 32px 26px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      text-align: center;
    }
    h1.game-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #f8fafc;
      text-shadow: 0 0 24px rgba(139, 92, 246, 0.75);
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(10, 14, 26, 0.95);
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #8b5cf6;
    }
    .color-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }
    .color-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-dot.selected {
      border-color: #fff;
      transform: scale(1.16);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.65);
    }
    .btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      box-shadow: 0 6px 22px rgba(124, 58, 237, 0.45);
      margin-bottom: 14px;
    }
    .join-row {
      display: flex;
      gap: 8px;
    }
    .join-row input {
      letter-spacing: 4px;
      font-weight: 800;
    }
    .btn-secondary {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      width: auto;
      white-space: nowrap;
      padding: 13px 20px;
    }
    #status-dot {
      margin-top: 10px;
      height: 14px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* 상단 HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 14px 18px;
      display: none;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(12, 16, 28, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.22);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      border-radius: 14px;
      pointer-events: auto;
    }
    .room-code-display {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .room-code-display strong {
      color: #38bdf8;
      font-size: 17px;
      letter-spacing: 2px;
    }
    .copy-btn {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
    }
    .door-progress {
      text-align: center;
    }
    .door-num {
      font-size: 20px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 1px;
    }
    .hearts {
      font-size: 16px;
      margin-top: 2px;
      letter-spacing: 2px;
    }
    .player-list {
      font-size: 12px;
      color: #cbd5e1;
      min-width: 120px;
    }
    .player-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .dot-mini {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    /* 대기실 시작 버튼 (글씨 없이 START 버튼만) */
    #lobby-banner {
      position: fixed;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: none;
    }
    #start-game-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px 34px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.45);
    }
    #start-game-btn:active {
      transform: scale(0.96);
    }

    /* 상호작용 힌트 */
    #interact-prompt {
      position: fixed;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 22;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #fbbf24;
      color: #fef08a;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      display: none;
      cursor: pointer;
    }
    #interact-prompt.full {
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* 감정표현(Emote) 바 */
    #emote-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 26;
      display: none;
      gap: 8px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      backdrop-filter: blur(6px);
      padding: 7px 12px;
      border-radius: 999px;
    }
    .emote-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.85);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s, background 0.15s;
    }
    .emote-btn:hover {
      transform: scale(1.15);
      background: #334155;
    }
    .emote-key {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: #0f172a;
      color: #94a3b8;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 3D 캐릭터 머리 위 이름표 & 감정표현 말풍선 */
    #nametags-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }
    .tag-wrapper {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .emote-bubble {
      font-size: 28px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 4px 10px;
      margin-bottom: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      animation: popEmote 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes popEmote {
      0% { transform: scale(0.2) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .nametag {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 초6 복습 퀴즈 모달 */
    #quiz-modal {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-card {
      background: #131726;
      border: 2px solid #6366f1;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .quiz-subject {
      background: rgba(99, 102, 241, 0.22);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .quiz-door-tag {
      font-size: 12px;
      color: #94a3b8;
    }
    .quiz-question {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      color: #f8fafc;
      margin-bottom: 18px;
      word-break: keep-all;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quiz-opt-btn {
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #f1f5f9;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .quiz-opt-btn:hover {
      background: #2d3b55;
      border-color: #818cf8;
    }
    .quiz-feedback {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
      text-align: center;
    }
    .quiz-close-btn {
      margin-top: 10px;
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 엔딩 모달 */
    #end-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 7, 15, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* 모바일 터치 컨트롤 */
    #mobile-controls {
      position: fixed;
      bottom: 76px;
      left: 18px;
      right: 18px;
      z-index: 25;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(2, 46px);
      gap: 6px;
      pointer-events: auto;
    }
    .pad-btn {
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #fff;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .action-touch-btn {
      pointer-events: auto;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.85);
      border: 2px solid #fef08a;
      color: #0f172a;
      font-weight: 900;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>
  <div id="nametags-container"></div>

  <!-- 시작 화면 (안내 글씨 없이 깔끔한 UI만 배치) -->
  <div id="start-screen">
    <div class="panel">
      <h1 class="game-title">DOORS 6</h1>

      <div class="form-group">
        <input type="text" id="nickname-input" placeholder="닉네임" maxlength="10" />
      </div>

      <div class="color-picker" id="color-picker">
        <div class="color-dot selected" data-color="#38bdf8" style="background:#38bdf8;"></div>
        <div class="color-dot" data-color="#f472b6" style="background:#f472b6;"></div>
        <div class="color-dot" data-color="#4ade80" style="background:#4ade80;"></div>
        <div class="color-dot" data-color="#facc15" style="background:#facc15;"></div>
        <div class="color-dot" data-color="#a78bfa" style="background:#a78bfa;"></div>
        <div class="color-dot" data-color="#fb923c" style="background:#fb923c;"></div>
      </div>

      <button class="btn btn-primary" id="create-room-btn">방 만들기</button>

      <div class="join-row">
        <input type="text" id="room-code-input" placeholder="코드" maxlength="4" />
        <button class="btn btn-secondary" id="join-room-btn">입장</button>
      </div>

      <div id="status-dot"></div>
    </div>
  </div>

  <!-- 상단 HUD -->
  <div id="hud">
    <div class="hud-box">
      <div class="room-code-display">
        <strong id="hud-room-code">----</strong>
        <button class="copy-btn" id="copy-code-btn">복사</button>
        <button class="copy-btn" id="sound-toggle-btn">🔊</button>
      </div>
    </div>

    <div class="hud-box door-progress">
      <div class="door-num">DOOR <span id="hud-door-num">00</span> / 25</div>
      <div class="hearts" id="hud-hearts">❤️❤️❤️</div>
    </div>

    <div class="hud-box player-list" id="hud-players">
      <div id="player-list-items"></div>
    </div>
  </div>

  <!-- 대기실 시작 버튼 -->
  <div id="lobby-banner">
    <button id="start-game-btn">START</button>
  </div>

  <!-- 상호작용 버튼 (경고 메시지 절대 없음) -->
  <div id="interact-prompt">[E]</div>

  <!-- 감정표현(Emote) 바 -->
  <div id="emote-bar">
    <button class="emote-btn" data-emote="👋" data-anim="wave">👋<span class="emote-key">1</span></button>
    <button class="emote-btn" data-emote="😱" data-anim="scared">😱<span class="emote-key">2</span></button>
    <button class="emote-btn" data-emote="🏃" data-anim="hurry">🏃<span class="emote-key">3</span></button>
    <button class="emote-btn" data-emote="🤫" data-anim="hide">🤫<span class="emote-key">4</span></button>
    <button class="emote-btn" data-emote="🎉" data-anim="spin">🎉<span class="emote-key">5</span></button>
    <button class="emote-btn" data-emote="😭" data-anim="cry">😭<span class="emote-key">6</span></button>
  </div>

  <!-- 초6 복습 퀴즈 모달 -->
  <div id="quiz-modal">
    <div class="quiz-card">
      <div class="quiz-header">
        <span class="quiz-subject" id="quiz-subject">수학</span>
        <span class="quiz-door-tag" id="quiz-door-tag">DOOR #01</span>
      </div>
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <button class="quiz-close-btn" id="quiz-close-btn">ESC</button>
    </div>
  </div>

  <!-- 엔딩 화면 -->
  <div id="end-modal">
    <div class="panel">
      <h1 class="game-title" id="end-title">CLEAR!</h1>
      <button class="btn btn-primary" onclick="location.reload()">다시 하기</button>
    </div>
  </div>

  <!-- 모바일 터치 컨트롤 -->
  <div id="mobile-controls">
    <div class="dpad">
      <div></div>
      <button class="pad-btn" data-key="ArrowUp">▲</button>
      <div></div>
      <button class="pad-btn" data-key="ArrowLeft">◀</button>
      <button class="pad-btn" data-key="ArrowDown">▼</button>
      <button class="pad-btn" data-key="ArrowRight">▶</button>
    </div>
    <button class="action-touch-btn" id="touch-action-btn">E</button>
  </div>

  <script>
    // ==========================================
    // 1. 초등학교 6학년 복습 퀴즈 문제 은행
    // ==========================================
    const GRADE6_QUIZZES = [
      { subject: "수학 · 원의 넓이", q: "반지름이 5cm인 원의 넓이는 몇 cm²인가요? (원주율: 3.1)", opts: ["31 cm²", "77.5 cm²", "15.5 cm²", "155 cm²"], ans: 1 },
      { subject: "수학 · 직육면체의 부피", q: "가로 4cm, 세로 3cm, 높이 5cm인 직육면체의 부피는?", opts: ["12 cm³", "35 cm³", "60 cm³", "94 cm³"], ans: 2 },
      { subject: "수학 · 비와 비율", q: "전체 학생 25명 중 여학생이 10명일 때, 전체에 대한 여학생 수의 백분율은?", opts: ["25%", "30%", "40%", "50%"], ans: 2 },
      { subject: "수학 · 분수의 나눗셈", q: "3/4 ÷ 1/2 을 계산하면 얼마인가요?", opts: ["3/8", "1과 1/2", "2/3", "1과 1/4"], ans: 1 },
      { subject: "수학 · 각기둥과 각뿔", q: "밑면이 오각형인 각기둥의 꼭짓점은 모두 몇 개인가요?", opts: ["5개", "6개", "10개", "15개"], ans: 2 },
      { subject: "수학 · 소수의 나눗셈", q: "끈 6.4m를 4명에게 똑같이 나누어 주면 한 명이 가지는 끈은 몇 m인가요?", opts: ["1.4m", "1.6m", "1.8m", "2.1m"], ans: 1 },
      { subject: "수학 · 비례식", q: "비례식 3 : 5 = 9 : □ 에서 □ 안에 들어갈 알맞은 수는?", opts: ["11", "12", "15", "18"], ans: 2 },
      { subject: "수학 · 원주율", q: "지름이 10cm인 원의 둘레(원주)는 몇 cm인가요? (원주율: 3.14)", opts: ["31.4cm", "62.8cm", "314cm", "78.5cm"], ans: 0 },
      { subject: "수학 · 분수의 나눗셈", q: "5/6 ÷ 5/3 을 간단히 계산한 값은?", opts: ["1/2", "2", "25/18", "1/3"], ans: 0 },
      { subject: "수학 · 원기둥과 원뿔", q: "원기둥을 한 번 잘라서 생기는 단면의 모양이 될 수 없는 것은?", opts: ["원", "직사각형", "타원", "정삼각형"], ans: 3 },

      { subject: "과학 · 지구와 달의 운동", q: "지구가 자전축을 중심으로 하루에 한 바퀴씩 서쪽에서 동쪽으로 도는 운동은?", opts: ["지구의 공전", "지구의 자전", "달의 공전", "계절의 변화"], ans: 1 },
      { subject: "과학 · 여러 가지 기체", q: "석회수를 뿌옇게 흐리게 만드는 성질이 있는 기체는 무엇인가요?", opts: ["산소", "질소", "이산화 탄소", "수소"], ans: 2 },

    // 2. Web Audio API 효과음 (유리 깨짐, 스파크, 괴음, 이모트)

    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, vol = 0.15, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // 전등 깨지고 스파크 튀는 이상현상 효과음 (글씨 없이 청각 경고)

      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // 유리 파편 고음

        playTone(f, 'sawtooth', 0.14, 0.16, idx * 0.03);
      });
      // 전기 스파크 지직 소리
      playTone(110, 'square', 0.45, 0.22, 0.05);
      playTone(58, 'sawtooth', 1.1, 0.28, 0.15);
    }

    function createDoorNumberTexture(num) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#191614';
      ctx.fillRect(0, 0, 128, 64);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 6;
      ctx.strokeRect(4, 4, 120, 56);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 34px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(num).padStart(4, '0'), 64, 34);
      return new THREE.CanvasTexture(c);

    function addCloset(id, roomIdx, x, z, side) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const box = new THREE.Mesh(new THREE.BoxGeometry(1.35, 3.1, 2.0), closetMat);

      seam.position.set(-side * 0.69, 1.5, 0);
      group.add(seam);

      // 3명 정원 표시 LED 점 3개 (옷장 상단에 배치되어 빈자리 직관 표시)
      const dots = [];

          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
        );
        dot.position.set(-side * 0.72, 2.85, dz);
        group.add(dot);
        dots.push(dot);
      });

      scene.add(group);
      closetObjects.push({ id, roomIdx, x, z, dots });

    function buildLargeHotel() {

      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), chaseEyeMat);
      eye.position.set(ex, 0.5, -2.5);
      chaseMesh.add(eye);
    });
    chaseMesh.add(chaseBody);
    chaseMesh.position.set(0, 2.6, 50);
    chaseMesh.visible = false;
    scene.add(chaseMesh);

    // 깨진 전등에서 튀는 유리/전기 스파크 파티클 생성 함수
    function spawnBrokenLampSparks(x, y, z) {
      for (let i = 0; i < 24; i++) {
        const isElectric = i % 2 === 0;
        const p = new THREE.Mesh(
          new THREE.BoxGeometry(0.1, 0.1, 0.1),
          new THREE.MeshBasicMaterial({ color: isElectric ? 0xfef08a : 0xe0f2fe })
        );
        p.position.set(x + (Math.random() - 0.5) * 0.5, y, z + (Math.random() - 0.5) * 0.5);
        scene.add(p);
        sparkParticles.push({
          mesh: p,
          vx: (Math.random() - 0.5) * 5.5,
          vy: (Math.random() - 0.2) * 3.0,
          vz: (Math.random() - 0.5) * 5.5,
          life: 1.2 + Math.random() * 0.6
        });
      }
    }

    // 이상현상 트리거 (경고 글씨 없이 깨진 전등, 스파크, 기울어진 액자, 붉은 조명 깜빡임으로 경고!)
    function triggerRoomAnomaly(roomIdx) {
      const rInfo = roomDataList[roomIdx];
      if (!rInfo) return;
      rInfo.anomalyBroken = true;
      rInfo.flickerTimer = 4.5;

      playAnomalyGlassBreakSound();
      cameraShake = 0.45;
      document.getElementById('vignette').classList.add('anomaly');

      // 전등 깨뜨리기 + 스파크 분출
      rInfo.lamps.forEach((lamp, idx) => {
        lamp.broken = true;
        lamp.bulb.material.color.setHex(0xef4444);
        lamp.bulb.position.y -= 0.35;
        lamp.cord.rotation.z = idx === 0 ? 0.35 : -0.4;
        lamp.light.color.setHex(0xdc2626);
        spawnBrokenLampSparks(lamp.x, lamp.y, lamp.z);
      });

      // 벽면 액자 비뚤어짐
      rInfo.paintings.forEach((p, idx) => {
        p.rotation.x = idx === 0 ? 0.38 : -0.42;
      });
    }

    // ==========================================
    // 6. 귀여운 3D 미니 캐릭터 & 감정표현 애니메이션
    // ==========================================
    function createCuteCharacterMesh(colorHex) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.85, 16), bodyMat);
      torso.position.y = 0.55;
      group.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 16, 16), bodyMat);
      head.position.y = 1.25;
      group.add(head);

      const pack = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.55, 0.28),
        new THREE.MeshStandardMaterial({ color: 0x334155 })
      );
      pack.position.set(0, 0.65, 0.42);
      group.add(pack);

      const whiteEye = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

      [-0.16, 0.16].forEach(ex => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), whiteEye);
        eye.position.set(ex, 1.3, -0.4);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), pupilMat);
        pupil.position.set(ex, 1.3, -0.49);
        group.add(eye, pupil);
      });

      return group;
    }

    function ensurePlayerVisual(id, data) {
      if (!playerMeshes[id]) {
        const mesh = createCuteCharacterMesh(data.color || '#38bdf8');
        scene.add(mesh);
        playerMeshes[id] = mesh;

        const wrap = document.createElement('div');
        wrap.className = 'tag-wrapper';
        wrap.innerHTML = `<div class="emote-bubble" style="display:none;"></div><div class="nametag"></div>`;
        document.getElementById('nametags-container').appendChild(wrap);
        tagWrappers[id] = wrap;
      }

      const mesh = playerMeshes[id];
      mesh.visible = !data.hiddenClosetId;
      mesh.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.transparent = !!data.ghost;
          child.material.opacity = data.ghost ? 0.42 : 1.0;
        }
      });

      const wrap = tagWrappers[id];
      const tag = wrap.querySelector('.nametag');
      tag.textContent = (data.ghost ? '👻 ' : '') + data.name;

      const bubble = wrap.querySelector('.emote-bubble');
      if (data.emote && Date.now() - data.emoteTime < 2600) {
        bubble.textContent = data.emote;
        bubble.style.display = 'block';
      } else {
        bubble.style.display = 'none';
      }
    }

    function updatePlayerListUI() {
      const container = document.getElementById('player-list-items');
      container.innerHTML = '';
      Object.entries(players).forEach(([id, p]) => {
        const div = document.createElement('div');
        div.className = 'player-item';
        div.innerHTML = `<span class="dot-mini" style="background:${p.color}"></span>
          <span>${p.name} ${p.ghost ? '👻' : ''}</span>`;
        container.appendChild(div);
      });
    }

    // 감정표현 실행
    function triggerEmote(emoteChar, animType) {
      if (!players[myId] || gamePhase === 'MENU') return;
      playEmoteSound();
      players[myId].emote = emoteChar;
      players[myId].emoteAnim = animType;
      players[myId].emoteTime = Date.now();
      ensurePlayerVisual(myId, players[myId]);

      if (!isHost && hostConn && hostConn.open) {
        hostConn.send({ type: 'EMOTE', emote: emoteChar, anim: animType });
      }
    }

    document.querySelectorAll('.emote-btn').forEach(btn => {
      btn.onclick = () => triggerEmote(btn.dataset.emote, btn.dataset.anim);
    });

    // ==========================================
    // 7. 온라인 멀티플레이어 (PeerJS WebRTC)
    // ==========================================
    const colorDots = document.querySelectorAll('.color-dot');
    colorDots.forEach(dot => {
      dot.onclick = () => {
        colorDots.forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        myColor = dot.dataset.color;
      };
    });

    function initLocalPlayer() {
      const rawName = document.getElementById('nickname-input').value.trim();
      myName = rawName || '탐험가' + Math.floor(10 + Math.random() * 89);
      players[myId] = {
        name: myName,
        color: myColor,
        x: 0,
        z: 3,
        hiddenClosetId: null,
        ghost: false,
        emote: '',
        emoteAnim: '',
        emoteTime: 0
      };
      ensurePlayerVisual(myId, players[myId]);
      updatePlayerListUI();
    }

    function enterGameScreen() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('emote-bar').style.display = 'flex';
      document.getElementById('hud-room-code').textContent = roomCode;
      if ('ontouchstart' in window || window.innerWidth < 820) {
        document.getElementById('mobile-controls').style.display = 'flex';
      }
      gamePhase = 'LOBBY';
      if (isHost) {
        document.getElementById('lobby-banner').style.display = 'block';
      }
    }

    function broadcastFromHost(payload) {
      if (!isHost) return;
      connections.forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    function sendToHost(payload) {
      if (isHost) {
        handleNetworkMessage(myId, payload);
      } else if (hostConn && hostConn.open) {
        hostConn.send(payload);
      }
    }

    document.getElementById('create-room-btn').onclick = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isHost = true;
      roomCode = String(Math.floor(1000 + Math.random() * 9000));
      const peerId = 'doors6-hard-' + roomCode;
      document.getElementById('status-dot').textContent = '...';

      peer = new Peer(peerId);
      peer.on('open', (id) => {
        myId = id;
        initLocalPlayer();
        enterGameScreen();
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleNetworkMessage(conn.peer, data));
        conn.on('close', () => {
          delete players[conn.peer];
          if (playerMeshes[conn.peer]) {
            scene.remove(playerMeshes[conn.peer]);
            delete playerMeshes[conn.peer];
          }
          if (tagWrappers[conn.peer]) {
            tagWrappers[conn.peer].remove();
            delete tagWrappers[conn.peer];
          }
          updatePlayerListUI();
        });
      });

      peer.on('error', () => {
        initLocalPlayer();
        enterGameScreen();
      });
    };

    document.getElementById('join-room-btn').onclick = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const code = document.getElementById('room-code-input').value.trim();
      if (code.length !== 4) return;
      isHost = false;
      roomCode = code;
      document.getElementById('status-dot').textContent = '...';

      peer = new Peer();
      peer.on('open', (id) => {
        myId = id;
        initLocalPlayer();
        hostConn = peer.connect('doors6-hard-' + roomCode);

        hostConn.on('open', () => {
          enterGameScreen();
          hostConn.send({ type: 'JOIN', player: players[myId] });
        });

        hostConn.on('data', (data) => handleClientReceive(data));
      });
    };

    document.getElementById('copy-code-btn').onclick = () => {
      navigator.clipboard?.writeText(roomCode);
      document.getElementById('copy-code-btn').textContent = '✓';
      setTimeout(() => document.getElementById('copy-code-btn').textContent = '복사', 1200);
    };

    document.getElementById('start-game-btn').onclick = () => {
      if (!isHost) return;
      gamePhase = 'PLAYING';
      document.getElementById('lobby-banner').style.display = 'none';
      broadcastFromHost({ type: 'GAME_START' });
    };

    function getClosetOccupantCount(closetId) {
      let count = 0;
      Object.values(players).forEach(p => {
        if (p.hiddenClosetId === closetId) count++;
      });
      return count;
    }

    function handleNetworkMessage(senderId, data) {
      if (data.type === 'JOIN') {
        players[senderId] = data.player;
        ensurePlayerVisual(senderId, data.player);
        updatePlayerListUI();
        broadcastFromHost({ type: 'SYNC_ALL', players, unlockedDoor, gamePhase, chaseActive });
      } else if (data.type === 'MOVE') {
        if (players[senderId]) {
          players[senderId].x = data.x;
          players[senderId].z = data.z;
          players[senderId].hiddenClosetId = data.hiddenClosetId;
          players[senderId].ghost = data.ghost;
        }
      } else if (data.type === 'EMOTE') {
        if (players[senderId]) {
          players[senderId].emote = data.emote;
          players[senderId].emoteAnim = data.anim;
          players[senderId].emoteTime = Date.now();
        }
      } else if (data.type === 'OPEN_DOOR') {
        hostOpenDoor(data.doorNum);
      }
    }

    function handleClientReceive(data) {
      if (data.type === 'GAME_START') {
        gamePhase = 'PLAYING';
        document.getElementById('lobby-banner').style.display = 'none';
      } else if (data.type === 'SYNC_ALL') {
        Object.entries(data.players).forEach(([id, p]) => {
          if (id !== myId) {
            players[id] = p;
            ensurePlayerVisual(id, p);
          }
        });
        updatePlayerListUI();
        if (data.unlockedDoor > unlockedDoor) {
          for (let d = unlockedDoor + 1; d <= data.unlockedDoor; d++) {
            applyDoorOpenedLocal(d, false);
          }
        }
        if (data.gamePhase === 'PLAYING' && gamePhase === 'LOBBY') {
          gamePhase = 'PLAYING';
          document.getElementById('lobby-banner').style.display = 'none';
        }
      } else if (data.type === 'DOOR_OPENED') {
        applyDoorOpenedLocal(data.doorNum, true);
      } else if (data.type === 'MONSTER_EVENT') {
        if (data.kind === 'RUSH') {
          triggerRushSequence(data.doorNum);
        } else if (data.kind === 'CHASE') {
          startChaseEvent(data.doorNum);
        }
      }
    }

    setInterval(() => {
      if (!players[myId] || gamePhase === 'MENU') return;
      if (isHost) {
        broadcastFromHost({ type: 'SYNC_ALL', players, unlockedDoor, gamePhase, chaseActive });
      } else if (hostConn && hostConn.open) {
        hostConn.send({
          type: 'MOVE',
          x: players[myId].x,
          z: players[myId].z,
          hiddenClosetId: hiddenClosetId,
          ghost: isGhost
        });
      }
    }, 60);

    // ==========================================
    // 8. 문 열기, 초6 퀴즈, 80% 확률 몬스터 이벤트
    // ==========================================
    let usedQuizIndices = new Set();

    function openQuizForDoor(doorNum) {
      // 몬스터 추격전 중이거나 러시 이벤트 진행 중에는 절대 퀴즈 미출현!
      if (chaseActive || rushState !== 'NONE') return;

      let idx;
      if (usedQuizIndices.size >= GRADE6_QUIZZES.length) usedQuizIndices.clear();
      do {
        idx = Math.floor(Math.random() * GRADE6_QUIZZES.length);
      } while (usedQuizIndices.has(idx));
      usedQuizIndices.add(idx);

      const qObj = GRADE6_QUIZZES[idx];
      document.getElementById('quiz-subject').textContent = qObj.subject;
      document.getElementById('quiz-door-tag').textContent = `DOOR #${String(doorNum).padStart(2, '0')}`;
      document.getElementById('quiz-question').textContent = qObj.q;
      document.getElementById('quiz-feedback').textContent = '';

      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';

      qObj.opts.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = `${i + 1}. ${optText}`;
        btn.onclick = () => {
          if (i === qObj.ans) {
            playCorrectSound();
            document.getElementById('quiz-feedback').style.color = '#4ade80';
            document.getElementById('quiz-feedback').textContent = 'O';
            setTimeout(() => {
              document.getElementById('quiz-modal').style.display = 'none';
              sendToHost({ type: 'OPEN_DOOR', doorNum });
            }, 300);
          } else {
            // 난이도 상향: 오답 시 체력 1 감소 페널티!
            playWrongSound();
            document.getElementById('quiz-feedback').style.color = '#f87171';
            document.getElementById('quiz-feedback').textContent = 'X (-❤️)';
            takeDamage();
          }
        };
        optsContainer.appendChild(btn);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    document.getElementById('quiz-close-btn').onclick = () => {
      document.getElementById('quiz-modal').style.display = 'none';
    };

    let chaseDoorsRemaining = 0;

    function hostOpenDoor(doorNum) {
      if (doorNum <= unlockedDoor) return;
      applyDoorOpenedLocal(doorNum, true);
      broadcastFromHost({ type: 'DOOR_OPENED', doorNum });

      if (doorNum >= TOTAL_DOORS) return;

      // 추격전 진행 중이라면 남은 추격 문 카운트 감소
      if (chaseActive) {
        chaseDoorsRemaining--;
        if (chaseDoorsRemaining <= 0) {
          endChaseEvent();
        }
        return;
      }

      // 80% 확률로 몬스터 출현! (1번 문 이후부터 80% 확률 적용)
      if (doorNum >= 1 && Math.random() < MONSTER_SPAWN_CHANCE) {
        // 80% 중 22%는 추격전(3개 방 연속 질주), 78%는 방 전체를 휩쓰는 초고속 그림자 러시
        if (doorNum <= TOTAL_DOORS - 3 && Math.random() < 0.22) {
          chaseDoorsRemaining = 3;
          startChaseEvent(doorNum);
          broadcastFromHost({ type: 'MONSTER_EVENT', kind: 'CHASE', doorNum });
        } else {
          triggerRushSequence(doorNum);
          broadcastFromHost({ type: 'MONSTER_EVENT', kind: 'RUSH', doorNum });
        }
      }
    }

    function applyDoorOpenedLocal(doorNum, playFx) {
      if (doorNum <= unlockedDoor) return;
      unlockedDoor = doorNum;
      document.getElementById('hud-door-num').textContent = String(doorNum).padStart(2, '0');
      const doorObj = doorObjects.find(d => d.doorNum === doorNum);
      if (doorObj) doorObj.opened = true;
      if (playFx) playDoorSound();

      if (doorNum >= TOTAL_DOORS) {
        chaseActive = false;
        chaseMesh.visible = false;
        setTimeout(() => {
          gamePhase = 'VICTORY';
          document.getElementById('end-title').textContent = 'ESCAPE CLEAR!';
          document.getElementById('end-modal').style.display = 'flex';
        }, 700);
      }
    }

    // 몬스터 이벤트 A: 이상현상(전등 깨짐) 직후 매우 짧은 타이밍(1.35초)에 방 전체를 휩쓰는 러시!
    function triggerRushSequence(doorNum) {
      if (rushState !== 'NONE') return;
      rushState = 'ANOMALY';
      rushHitThisPass = false;

      // 열린 문 바로 앞 방(doorNum번 방)과 현재 방(doorNum - 1번 방)에 이상현상(깨진 전등 + 스파크) 발생!
      triggerRoomAnomaly(doorNum);
      triggerRoomAnomaly(Math.max(0, doorNum - 1));

      // 옷장에 숨기 매우 어렵게 단 1.35초 뒤에 초고속으로 돌진!
      setTimeout(() => {
        rushState = 'CHARGING';
        // 복도 가장 안쪽 끝에서 출발하여 시작 지점(+20)까지 방 전체를 관통!
        rushMonsterZ = -(TOTAL_DOORS + 1) * ROOM_LENGTH;
        rushMesh.visible = true;
        rushMesh.position.set(0, 2.2, rushMonsterZ);
        playRushPassSound();
      }, 1350);
    }

    // 몬스터 이벤트 B: 어둠의 추격전 (이상현상 발생 후 퀴즈 없이 문 열고 전력 질주!)
    function startChaseEvent(doorNum) {
      chaseActive = true;
      triggerRoomAnomaly(doorNum);
      chaseMonsterZ = -(doorNum - 1) * ROOM_LENGTH + 7.5;
      chaseMesh.visible = true;
      document.getElementById('vignette').classList.add('anomaly');
    }

    function endChaseEvent() {
      chaseActive = false;
      chaseMesh.visible = false;
      document.getElementById('vignette').classList.remove('anomaly');
      playCorrectSound();
    }

    function takeDamage() {
      if (isGhost) return;
      hearts = Math.max(0, hearts - 1);
      playWrongSound();
      cameraShake = 0.6;
      document.getElementById('hud-hearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);

      if (hearts === 0) {
        isGhost = true;
        players[myId].ghost = true;
      }
    }

    // ==========================================
    // 9. 입력 처리 (이동, 옷장 3인 제한, 감정표현)
    // ==========================================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyE' || e.code === 'Space') {
        if (document.getElementById('quiz-modal').style.display === 'flex') return;
        handleInteract();
      } else if (e.code === 'Escape') {
        document.getElementById('quiz-modal').style.display = 'none';
      } else if (e.code === 'Digit1') {
        triggerEmote('👋', 'wave');
      } else if (e.code === 'Digit2') {
        triggerEmote('😱', 'scared');
      } else if (e.code === 'Digit3') {
        triggerEmote('🏃', 'hurry');
      } else if (e.code === 'Digit4') {
        triggerEmote('🤫', 'hide');
      } else if (e.code === 'Digit5') {
        triggerEmote('🎉', 'spin');
      } else if (e.code === 'Digit6') {
        triggerEmote('😭', 'cry');
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    document.querySelectorAll('.pad-btn').forEach(btn => {
      const k = btn.dataset.key;
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
      btn.addEventListener('mousedown', () => { keys[k] = true; });
      btn.addEventListener('mouseup', () => { keys[k] = false; });
    });
    document.getElementById('touch-action-btn').onclick = handleInteract;
    document.getElementById('interact-prompt').onclick = handleInteract;

    let nearbyTarget = null;

    function handleInteract() {
      if (gamePhase !== 'PLAYING' || !players[myId]) return;

      // 옷장에 숨어있는 상태라면 나오기
      if (hiddenClosetId) {
        hiddenClosetId = null;
        players[myId].hiddenClosetId = null;
        playTone(280, 'sine', 0.14, 0.1);
        return;
      }

      if (!nearbyTarget) return;

      if (nearbyTarget.type === 'CLOSET') {
        const cObj = nearbyTarget.obj;
        // 옷장 3명 인원 제한 검사!
        const currentCount = getClosetOccupantCount(cObj.id);
        if (currentCount >= CLOSET_CAPACITY) {
          playWrongSound();
          return;
        }
        hiddenClosetId = cObj.id;
        players[myId].hiddenClosetId = cObj.id;
        players[myId].x = cObj.x;
        players[myId].z = cObj.z;
        playTone(210, 'sine', 0.18, 0.12);
      } else if (nearbyTarget.type === 'DOOR') {
        const dNum = nearbyTarget.obj.doorNum;
        if (dNum !== unlockedDoor + 1) return;

        // 몬스터 추격전 중이거나 러시 이벤트 중에는 퀴즈 없이 즉시 열림!
        if (chaseActive || rushState !== 'NONE') {
          sendToHost({ type: 'OPEN_DOOR', doorNum: dNum });
        } else {
          openQuizForDoor(dNum);
        }
      }
    }

    // ==========================================
    // 10. 메인 게임 루프
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1) 문 애니메이션
      doorObjects.forEach(d => {
        const targetRot = d.opened ? -Math.PI * 0.55 : 0;
        d.pivot.rotation.y += (targetRot - d.pivot.rotation.y) * 9 * dt;
      });

      // 2) 옷장 LED 점 업데이트 (남은 자리 표시: 최대 3명)
      closetObjects.forEach(c => {
        const occ = getClosetOccupantCount(c.id);
        const isFull = occ >= CLOSET_CAPACITY;
        c.dots.forEach((dot, idx) => {
          if (isFull) {
            dot.material.color.setHex(0xef4444); // 3명 만원: 빨간색
          } else if (idx < occ) {
            dot.material.color.setHex(0xfbbf24); // 사용 중: 노란색
          } else {
            dot.material.color.setHex(0x38bdf8); // 빈자리: 하늘색
          }
        });
      });

      // 3) 유리/스파크 파티클 업데이트
      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const sp = sparkParticles[i];
        sp.life -= dt;
        sp.vy -= 9.8 * dt;
        sp.mesh.position.x += sp.vx * dt;
        sp.mesh.position.y += sp.vy * dt;
        sp.mesh.position.z += sp.vz * dt;
        if (sp.mesh.position.y < 0.05) {
          sp.mesh.position.y = 0.05;
          sp.vy *= -0.35;
        }
        if (sp.life <= 0) {
          scene.remove(sp.mesh);
          sparkParticles.splice(i, 1);
        }
      }

      // 4) 이상현상 전등 깜빡임 & 액자 떨림 업데이트
      roomDataList.forEach(r => {
        if (r.flickerTimer > 0) {
          r.flickerTimer -= dt;
          r.lamps.forEach(lamp => {
            lamp.light.intensity = Math.random() > 0.42 ? 1.4 : 0.02;
          });
          r.paintings.forEach(p => {
            p.rotation.z = Math.sin(elapsed * 45) * 0.08;
          });
          if (r.flickerTimer <= 0) {
            r.lamps.forEach(lamp => {
              // 깨진 전등은 어둡고 붉게 유지되어 흔적이 남음
              lamp.light.intensity = lamp.broken ? 0.25 : 0.9;
            });
            r.paintings.forEach(p => { p.rotation.z = 0; });
          }
        }
      });

      // 5) 내 캐릭터 이동
      if (players[myId] && (gamePhase === 'LOBBY' || gamePhase === 'PLAYING')) {
        const me = players[myId];
        if (!hiddenClosetId && document.getElementById('quiz-modal').style.display !== 'flex') {
          let moveX = 0;
          let moveZ = 0;
          if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
          if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
          if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
          if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

          if (moveX !== 0 || moveZ !== 0) {
            const len = Math.hypot(moveX, moveZ);
            const speed = chaseActive ? 7.3 : 6.5;
            let nextX = me.x + (moveX / len) * speed * dt;
            let nextZ = me.z + (moveZ / len) * speed * dt;

            nextX = Math.max(-CORRIDOR_HALF_W + 0.7, Math.min(CORRIDOR_HALF_W - 0.7, nextX));
            nextZ = Math.min(8.5, nextZ);

            const nextClosedDoor = doorObjects.find(d => d.doorNum === unlockedDoor + 1);
            if (nextClosedDoor && nextZ < nextClosedDoor.z + 0.7) {
              nextZ = nextClosedDoor.z + 0.7;
            }
            if (gamePhase === 'LOBBY' && nextZ < -ROOM_LENGTH / 2 + 0.9) {
              nextZ = -ROOM_LENGTH / 2 + 0.9;
            }

            let blocked = false;
            for (const obs of obstacleObjects) {
              if (Math.abs(nextX - obs.x) < obs.halfW + 0.38 && Math.abs(nextZ - obs.z) < obs.halfD + 0.38) {
                blocked = true;
                break;
              }
            }
            if (!blocked) {
              me.x = nextX;
              me.z = nextZ;
            }
          }
        }

        // 주변 상호작용 감지 (옷장 3명 인원 표시)
        nearbyTarget = null;
        const promptEl = document.getElementById('interact-prompt');
        promptEl.classList.remove('full');

        if (gamePhase === 'PLAYING') {
          if (hiddenClosetId) {
            promptEl.textContent = '[E] 나오기';
            promptEl.style.display = 'block';
          } else {
            let bestDist = 2.3;
            for (const c of closetObjects) {
              const dist = Math.hypot(me.x - c.x, me.z - c.z);
              if (dist < bestDist) {
                bestDist = dist;
                nearbyTarget = { type: 'CLOSET', obj: c };
              }
            }

            const nextDoor = doorObjects.find(d => d.doorNum === unlockedDoor + 1);
            if (nextDoor && Math.hypot(me.x - 0, me.z - nextDoor.z) < 2.5) {
              nearbyTarget = { type: 'DOOR', obj: nextDoor };
            }

            if (nearbyTarget) {
              if (nearbyTarget.type === 'CLOSET') {
                const occ = getClosetOccupantCount(nearbyTarget.obj.id);
                if (occ >= CLOSET_CAPACITY) {
                  promptEl.textContent = `MAX (${occ}/${CLOSET_CAPACITY})`;
                  promptEl.classList.add('full');
                } else {
                  promptEl.textContent = `[E] (${occ}/${CLOSET_CAPACITY})`;
                }
              } else {
                promptEl.textContent = `[E] ${String(nearbyTarget.obj.doorNum).padStart(4, '0')}`;
              }
              promptEl.style.display = 'block';
            } else {
              promptEl.style.display = 'none';
            }
          }
        }

        // 카메라 추적 & 이상현상 화면 흔들림
        cameraShake = Math.max(0, cameraShake - dt * 1.4);
        const shakeX = (Math.random() - 0.5) * cameraShake;
        const shakeY = (Math.random() - 0.5) * cameraShake;

        const targetCamX = me.x * 0.52;
        const targetCamZ = me.z + 6.4;
        camera.position.x += (targetCamX - camera.position.x) * 6 * dt + shakeX;
        camera.position.z += (targetCamZ - camera.position.z) * 6 * dt;
        camera.position.y = 4.3 + shakeY;
        camera.lookAt(me.x * 0.35, 1.3, me.z - 6.5);

        playerLight.position.set(me.x, 2.7, me.z - 0.5);
      }

      // 6) 모든 플레이어 3D 캐릭터 & 감정표현 모션 업데이트
      Object.entries(players).forEach(([id, p]) => {
        ensurePlayerVisual(id, p);
        const mesh = playerMeshes[id];
        mesh.position.x += (p.x - mesh.position.x) * 14 * dt;
        mesh.position.z += (p.z - mesh.position.z) * 14 * dt;

        // 감정표현 모션 적용
        const emoteElapsed = (Date.now() - (p.emoteTime || 0)) / 1000;
        let extraY = 0;
        mesh.rotation.y = 0;
        mesh.rotation.z = 0;

        if (emoteElapsed < 2.2) {
          if (p.emoteAnim === 'wave' || p.emoteAnim === 'hurry') {
            extraY = Math.abs(Math.sin(elapsed * 14)) * 0.45;
          } else if (p.emoteAnim === 'spin') {
            extraY = Math.abs(Math.sin(elapsed * 10)) * 0.35;
            mesh.rotation.y = elapsed * 10;
          } else if (p.emoteAnim === 'scared' || p.emoteAnim === 'cry') {
            mesh.rotation.z = Math.sin(elapsed * 32) * 0.16;
          }
        }

        mesh.position.y = (p.ghost ? 0.5 + Math.sin(elapsed * 4) * 0.15 : Math.abs(Math.sin(elapsed * 10)) * 0.06) + extraY;

        const wrap = tagWrappers[id];
        const headPos = new THREE.Vector3(mesh.position.x, mesh.position.y + 2.05, mesh.position.z);
        headPos.project(camera);
        if (headPos.z < 1) {
          const sx = (headPos.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-headPos.y * 0.5 + 0.5) * window.innerHeight;
          wrap.style.left = `${sx}px`;
          wrap.style.top = `${sy}px`;
          wrap.style.display = 'flex';
        } else {
          wrap.style.display = 'none';
        }
      });

      // 7) 방 전체를 관통하는 초고속 러시 몬스터 업데이트
      if (rushState === 'CHARGING') {
        rushMonsterZ += 48 * dt; // 매우 빠른 속도로 방 전체 통과
        rushMesh.position.z = rushMonsterZ;
        cameraShake = 0.28;

        // 지나가는 방의 조명도 연쇄적으로 깜빡임
        const passRoomIdx = Math.round(-rushMonsterZ / ROOM_LENGTH);
        if (roomDataList[passRoomIdx]) {
          roomDataList[passRoomIdx].flickerTimer = Math.max(roomDataList[passRoomIdx].flickerTimer, 0.8);
        }

        // 방 전체 폭을 휩쓸기 때문에 옷장에 숨지 않으면 무조건 피격!
        if (players[myId] && !hiddenClosetId && !rushHitThisPass && Math.abs(players[myId].z - rushMonsterZ) < 2.2) {
          rushHitThisPass = true;
          takeDamage();
        }

        // 시작점(+22)까지 완전히 통과한 후 종료
        if (rushMonsterZ > 22) {
          rushState = 'NONE';
          rushMesh.visible = false;
          if (!chaseActive) {
            document.getElementById('vignette').classList.remove('anomaly');
          }
        }
      }

      // 8) 어둠의 추격자(Chase) 업데이트 (난이도 상향: 매우 빠른 추격 속도)
      if (chaseActive && players[myId]) {
        chaseMonsterZ -= 6.55 * dt;
        chaseMesh.position.z = chaseMonsterZ;
        chaseMesh.position.x = Math.sin(elapsed * 4) * 1.2;
        cameraShake = 0.16;

        if (players[myId].z > chaseMonsterZ - 2.1) {
          takeDamage();
          chaseMonsterZ += 7.0;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
