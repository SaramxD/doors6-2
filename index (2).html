<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DOORS 6</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    }
    body {
      overflow: hidden;
      background-color: #040508;
      color: #f1f5f9;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #game-canvas:active {
      cursor: grabbing;
    }

    /* 어두운 시야 비네트 */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 32%, rgba(0, 0, 0, 0.95) 100%);
      z-index: 5;
      transition: background 0.2s;
    }
    #vignette.anomaly {
      background: radial-gradient(circle at center, rgba(145, 10, 28, 0.2) 22%, rgba(20, 0, 6, 0.97) 100%);
    }
    #vignette.ambush {
      background: radial-gradient(circle at center, rgba(16, 125, 92, 0.2) 22%, rgba(4, 26, 20, 0.97) 100%);
    }

    /* 1인칭 컷신 시네마틱 레터박스 바 */
    .cutscene-bar {
      position: fixed;
      left: 0;
      right: 0;
      height: 0;
      background: #000;
      z-index: 35;
      pointer-events: none;
      transition: height 0.35s ease;
    }
    #cutscene-top { top: 0; }
    #cutscene-bottom { bottom: 0; }
    body.in-cutscene #cutscene-top,
    body.in-cutscene #cutscene-bottom {
      height: 11vh;
    }

    /* 1인칭 시점 중앙 크로스헤어 점 */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    /* 시작 화면 */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at 50% 35%, #19162e 0%, #040508 82%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .panel {
      background: rgba(14, 16, 26, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 32px 26px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      text-align: center;
    }
    h1.game-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #f8fafc;
      text-shadow: 0 0 24px rgba(139, 92, 246, 0.75);
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(10, 14, 26, 0.95);
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #8b5cf6;
    }
    .color-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }
    .color-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-dot.selected {
      border-color: #fff;
      transform: scale(1.16);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.65);
    }
    .btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      box-shadow: 0 6px 22px rgba(124, 58, 237, 0.45);
      margin-bottom: 14px;
    }
    .join-row {
      display: flex;
      gap: 8px;
    }
    .join-row input {
      letter-spacing: 4px;
      font-weight: 800;
    }
    .btn-secondary {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      width: auto;
      white-space: nowrap;
      padding: 13px 20px;
    }
    #status-dot {
      margin-top: 10px;
      height: 14px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* 상단 HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 14px 18px;
      display: none;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(12, 16, 28, 0.86);
      border: 1px solid rgba(148, 163, 184, 0.22);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      border-radius: 14px;
      pointer-events: auto;
    }
    .room-code-display {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .room-code-display strong {
      color: #38bdf8;
      font-size: 17px;
      letter-spacing: 2px;
    }
    .hud-mini-btn {
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 7px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
    }
    .hud-mini-btn:hover:not(:disabled) {
      background: #334155;
    }
    .hud-mini-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      border-color: #ef4444;
      color: #fca5a5;
    }
    .door-progress {
      text-align: center;
    }
    .door-num {
      font-size: 20px;
      font-weight: 900;
      color: #fbbf24;
      letter-spacing: 1px;
    }
    .hearts {
      font-size: 16px;
      margin-top: 2px;
      letter-spacing: 2px;
    }
    .buff-icons {
      font-size: 12px;
      margin-top: 3px;
      color: #7dd3fc;
      min-height: 15px;
    }
    .player-list {
      font-size: 12px;
      color: #cbd5e1;
      min-width: 115px;
    }
    .player-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }
    .dot-mini {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    /* 대기실 시작 버튼 */
    #lobby-banner {
      position: fixed;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: none;
    }
    #start-game-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 14px 34px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.45);
    }

    /* 상호작용 버튼 */
    #interact-prompt {
      position: fixed;
      bottom: 158px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 22;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #fbbf24;
      color: #fef08a;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      display: none;
      cursor: pointer;
    }
    #interact-prompt.full {
      border-color: #ef4444;
      color: #fca5a5;
    }

    /* 하단 인벤토리 (3칸) + 감정표현 바 */
    #bottom-bars {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 26;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #inventory-bar {
      display: flex;
      gap: 8px;
      background: rgba(12, 16, 28, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.3);
      backdrop-filter: blur(6px);
      padding: 6px 10px;
      border-radius: 16px;
    }
    .inv-slot {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s;
    }
    .inv-slot.has-item {
      border-color: #fbbf24;
      background: rgba(51, 65, 85, 0.9);
    }
    .inv-slot.has-item:hover {
      transform: translateY(-3px);
    }
    .inv-icon {
      font-size: 23px;
      line-height: 1;
    }
    .inv-label {
      font-size: 9px;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .inv-key {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 9px;
      font-weight: 800;
      color: #94a3b8;
    }

    #emote-bar {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .emote-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(30, 41, 59, 0.85);
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.12s;
    }
    .emote-btn:hover {
      transform: scale(1.15);
    }
    .emote-key {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: #0f172a;
      color: #94a3b8;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 4px;
    }

    /* 3D 캐릭터 머리 위 이름표 & 감정표현 말풍선 */
    #nametags-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }
    .tag-wrapper {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .emote-bubble {
      font-size: 26px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 3px 9px;
      margin-bottom: 5px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      animation: popEmote 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes popEmote {
      0% { transform: scale(0.2) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .nametag {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 초6 복습 퀴즈 모달 (제한시간 게이지 포함) */
    #quiz-modal {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: rgba(5, 7, 15, 0.87);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-card {
      background: #131726;
      border: 2px solid #6366f1;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }
    .quiz-timer-bar {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    #quiz-timer-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
      transition: width 0.1s linear;
    }
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .quiz-subject {
      background: rgba(99, 102, 241, 0.22);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .quiz-door-tag {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }
    .quiz-question {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      color: #f8fafc;
      margin-bottom: 18px;
      word-break: keep-all;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quiz-opt-btn {
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #f1f5f9;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .quiz-opt-btn:hover {
      background: #2d3b55;
      border-color: #818cf8;
    }
    .quiz-feedback {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      min-height: 18px;
      text-align: center;
    }
    .quiz-close-btn {
      margin-top: 10px;
      width: 100%;
      padding: 9px;
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    /* 엔딩 모달 */
    #end-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 7, 15, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* 모바일 터치 컨트롤 */
    #mobile-controls {
      position: fixed;
      bottom: 128px;
      left: 16px;
      right: 16px;
      z-index: 25;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 44px);
      gap: 5px;
      pointer-events: auto;
    }
    .pad-btn {
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #fff;
      border-radius: 11px;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .action-touch-btn {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.85);
      border: 2px solid #fef08a;
      color: #0f172a;
      font-weight: 900;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>
  <div id="vignette"></div>
  <div id="cutscene-top" class="cutscene-bar"></div>
  <div id="cutscene-bottom" class="cutscene-bar"></div>
  <div id="crosshair"></div>
  <div id="nametags-container"></div>

  <!-- 시작 화면 -->
  <div id="start-screen">
    <div class="panel">
      <h1 class="game-title">DOORS 6</h1>

      <div class="form-group">
        <input type="text" id="nickname-input" placeholder="닉네임" maxlength="10" />
      </div>

      <div class="color-picker" id="color-picker">
        <div class="color-dot selected" data-color="#38bdf8" style="background:#38bdf8;"></div>
        <div class="color-dot" data-color="#f472b6" style="background:#f472b6;"></div>
        <div class="color-dot" data-color="#4ade80" style="background:#4ade80;"></div>
        <div class="color-dot" data-color="#facc15" style="background:#facc15;"></div>
        <div class="color-dot" data-color="#a78bfa" style="background:#a78bfa;"></div>
        <div class="color-dot" data-color="#fb923c" style="background:#fb923c;"></div>
      </div>

      <button class="btn btn-primary" id="create-room-btn">방 만들기</button>

      <div class="join-row">
        <input type="text" id="room-code-input" placeholder="코드" maxlength="4" />
        <button class="btn btn-secondary" id="join-room-btn">입장</button>
      </div>

      <div id="status-dot"></div>
    </div>
  </div>

  <!-- 상단 HUD -->
  <div id="hud">
    <div class="hud-box">
      <div class="room-code-display">
        <strong id="hud-room-code">----</strong>
        <button class="hud-mini-btn" id="copy-code-btn">복사</button>
        <button class="hud-mini-btn" id="view-toggle-btn">👁️ 3인칭 [V]</button>
        <button class="hud-mini-btn" id="sound-toggle-btn">🔊</button>
      </div>
    </div>

    <div class="hud-box door-progress">
      <div class="door-num">DOOR <span id="hud-door-num">00</span> / 25</div>
      <div class="hearts" id="hud-hearts">❤️❤️❤️</div>
      <div class="buff-icons" id="hud-buffs"></div>
    </div>

    <div class="hud-box player-list" id="hud-players">
      <div id="player-list-items"></div>
    </div>
  </div>

  <!-- 대기실 시작 버튼 -->
  <div id="lobby-banner">
    <button id="start-game-btn">START</button>
  </div>

  <!-- 상호작용 버튼 -->
  <div id="interact-prompt">[E]</div>

  <!-- 하단 3칸 인벤토리 & 감정표현 바 -->
  <div id="bottom-bars">
    <div id="inventory-bar">
      <div class="inv-slot" id="inv-slot-0" onclick="useInventorySlot(0)">
        <span class="inv-key">Z</span>
        <span class="inv-icon" id="inv-icon-0"></span>
        <span class="inv-label" id="inv-label-0"></span>
      </div>
      <div class="inv-slot" id="inv-slot-1" onclick="useInventorySlot(1)">
        <span class="inv-key">X</span>
        <span class="inv-icon" id="inv-icon-1"></span>
        <span class="inv-label" id="inv-label-1"></span>
      </div>
      <div class="inv-slot" id="inv-slot-2" onclick="useInventorySlot(2)">
        <span class="inv-key">C</span>
        <span class="inv-icon" id="inv-icon-2"></span>
        <span class="inv-label" id="inv-label-2"></span>
      </div>
    </div>

    <div id="emote-bar">
      <button class="emote-btn" data-emote="👋" data-anim="wave">👋<span class="emote-key">1</span></button>
      <button class="emote-btn" data-emote="😱" data-anim="scared">😱<span class="emote-key">2</span></button>
      <button class="emote-btn" data-emote="🏃" data-anim="hurry">🏃<span class="emote-key">3</span></button>
      <button class="emote-btn" data-emote="🤫" data-anim="hide">🤫<span class="emote-key">4</span></button>
      <button class="emote-btn" data-emote="🎉" data-anim="spin">🎉<span class="emote-key">5</span></button>
      <button class="emote-btn" data-emote="😭" data-anim="cry">😭<span class="emote-key">6</span></button>
    </div>
  </div>

  <!-- 초6 복습 퀴즈 모달 -->
  <div id="quiz-modal">
    <div class="quiz-card">
      <div class="quiz-timer-bar"><div id="quiz-timer-fill"></div></div>
      <div class="quiz-header">
        <span class="quiz-subject" id="quiz-subject">수학</span>
        <span class="quiz-door-tag" id="quiz-door-tag">DOOR #01</span>
      </div>
      <div class="quiz-question" id="quiz-question"></div>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <button class="quiz-close-btn" id="quiz-close-btn">ESC</button>
    </div>
  </div>

  <!-- 엔딩 화면 -->
  <div id="end-modal">
    <div class="panel">
      <h1 class="game-title" id="end-title">CLEAR!</h1>
      <button class="btn btn-primary" onclick="location.reload()">다시 하기</button>
    </div>
  </div>

  <!-- 모바일 터치 컨트롤 -->
  <div id="mobile-controls">
    <div class="dpad">
      <div></div>
      <button class="pad-btn" data-key="ArrowUp">▲</button>
      <div></div>
      <button class="pad-btn" data-key="ArrowLeft">◀</button>

    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, vol = 0.15, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

      ctx.textBaseline = 'middle';
      ctx.fillText(String(num).padStart(4, '0'), 64, 34);
      return new THREE.CanvasTexture(c);

      openGrid[curR][curC] = true;
      mainPathCells.push([curR, curC]);

      // 입구 바로 앞 공간 확보 (컷신 시 시야 확보)
      openGrid[0][2] = true;
      openGrid[0][4] = true;

      while (curR < ROWS - 1) {
        // 좌우로 구불구불 이동
        const dir = rng() < 0.5 ? -1 : 1;
        const steps = 1 + Math.floor(rng() * 3); // 1~3칸 이동
        for (let s = 0; s < steps; s++) {
          const nextC = curC + dir;
          if (nextC >= 1 && nextC <= COLS - 2) {
            curC = nextC;
            if (!openGrid[curR][curC]) {
              openGrid[curR][curC] = true;
              mainPathCells.push([curR, curC]);
            }
          }
        }
        // 다음 행으로 전진
        curR++;
        if (!openGrid[curR][curC]) {
          openGrid[curR][curC] = true;
          mainPathCells.push([curR, curC]);
        }
      }

      // 마지막 행에서 출구 문(col=3)까지 연결
      while (curC !== 3) {
        curC += curC < 3 ? 1 : -1;
        if (!openGrid[curR][curC]) {
          openGrid[curR][curC] = true;
          mainPathCells.push([curR, curC]);
        }
      }

      // 미로다운 함정/막다른 길(Dead-ends) 3~4개 추가
      for (let b = 0; b < 4; b++) {
        const [br, bc] = mainPathCells[Math.floor(rng() * (mainPathCells.length - 2)) + 1];
        const bDir = rng() < 0.5 ? -1 : 1;
        for (let step = 1; step <= 2; step++) {
          const tc = bc + bDir * step;
          if (tc >= 0 && tc < COLS && br >= 1 && br <= ROWS - 2) {
            openGrid[br][tc] = true;
          }
        }
      }

      // 인도하는 빛(바닥의 은은한 푸른 표식)을 정답 경로 일부에 배치
      mainPathCells.forEach(([pr, pc], idx) => {
        if (idx % 2 === 1) {
          const gx = (pc - (COLS - 1) / 2) * CELL_W;
          const gz = zCenter + ROOM_LENGTH / 2 - (pr + 0.5) * CELL_D;
          const gOrb = new THREE.Mesh(
            new THREE.SphereGeometry(0.16, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.72 })
          );
          gOrb.position.set(gx, 0.22, gz);
          scene.add(gOrb);
          guidingOrbs.push(gOrb);
        }
      });

      // 벽 블록 설치
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!openGrid[r][c]) {
            const wx = (c - (COLS - 1) / 2) * CELL_W;
            const wz = zCenter + ROOM_LENGTH / 2 - (r + 0.5) * CELL_D;

            const wBlock = new THREE.Mesh(
              new THREE.BoxGeometry(CELL_W, 5.4, CELL_D),
              mazeWallMat
            );
            wBlock.position.set(wx, 2.7, wz);
            scene.add(wBlock);

            const baseboard = new THREE.Mesh(
              new THREE.BoxGeometry(CELL_W + 0.04, 0.45, CELL_D + 0.04),
              mazeTrimMat
            );
            baseboard.position.set(wx, 0.22, wz);
            scene.add(baseboard);

            obstacleObjects.push({
              x: wx,
              z: wz,
              halfW: CELL_W * 0.5,
              halfD: CELL_D * 0.5
            });
          }
        }
      }
    }

    function buildGiantHotel() {
      let closetCounter = 0;
      let itemCounter = 0;
      const itemTypes = Object.keys(ITEM_DEFS);
      const rng = mulberry32(202606);

      for (let i = 0; i <= TOTAL_DOORS; i++) {
        const zCenter = -i * ROOM_LENGTH;
        const isMazeRoom = MAZE_CHASE_ROOMS.includes(i);
        const halfW = isMazeRoom ? MAZE_HALF_W : CORRIDOR_HALF_W;

        const rInfo = {
          roomIdx: i,
          zCenter,
          lamps: [],
          paintings: [],
          flickerTimer: 0

        // 바닥 & 카펫 & 천장
        const floor = new THREE.Mesh(new THREE.BoxGeometry(halfW * 2, 0.4, ROOM_LENGTH), floorMat);
        floor.position.set(0, -0.2, zCenter);
        scene.add(floor);

        if (!isMazeRoom) {
          const carpet = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.04, ROOM_LENGTH), carpetMat);
          carpet.position.set(0, 0.01, zCenter);
          scene.add(carpet);
        }

        const ceiling = new THREE.Mesh(new THREE.BoxGeometry(halfW * 2, 0.4, ROOM_LENGTH), wallMat);
        ceiling.position.set(0, 5.6, zCenter);
        scene.add(ceiling);

        // 좌우 외벽
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.8, ROOM_LENGTH), wallMat);
        leftWall.position.set(-halfW - 0.3, 2.7, zCenter);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 5.8, ROOM_LENGTH), wallMat);
        rightWall.position.set(halfW + 0.3, 2.7, zCenter);
        scene.add(rightWall);

        // 전등 배치 (난이도 상향: 조도 낮춤)
        [-9.5, 0, 9.5].forEach(lzOffset => {
          const lz = zCenter + lzOffset;
          const lampLight = new THREE.PointLight(isMazeRoom ? 0xef4444 : 0xffb74d, isMazeRoom ? 0.45 : 0.65, 22);
          lampLight.position.set(0, 4.8, lz);
          scene.add(lampLight);

          const cord = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.03, 0.65, 6),

          cord.position.set(0, 5.2, lz);
          scene.add(cord);

          const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.28, 10, 10),
            new THREE.MeshBasicMaterial({ color: isMazeRoom ? 0xfca5a5 : 0xfef08a })
          );
          bulb.position.set(0, 4.85, lz);
          scene.add(bulb);

          rInfo.lamps.push({ light: lampLight, bulb, cord, x: 0, y: 4.85, z: lz, broken: false });
        });

        if (isMazeRoom) {
          // 미로 구역 전용 3D 미로 벽 생성!
          buildMazeRoomSegment(i, zCenter, rng);
        } else {
          // 일반 대형 호텔 홀: 벽면 액자, 기둥, 장애물, 옷장, 아이템 배치
          [-1, 1].forEach(side => {
            const pGroup = new THREE.Group();
            pGroup.position.set(side * (halfW - 0.05), 2.9, zCenter + side * 4.5);
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.7, 2.4), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            const art = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.4, 2.1), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
            pGroup.add(frame, art);
            scene.add(pGroup);
            rInfo.paintings.push(pGroup);
          });

          [[-4.2, -7.5], [4.2, -7.5], [-4.2, 7.5], [4.2, 7.5]].forEach(([px, pzOff]) => {
            const pz = zCenter + pzOff;
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 5.4, 1.1), pillarMat);
            pillar.position.set(px, 2.7, pz);
            scene.add(pillar);
            obstacleObjects.push({ x: px, z: pz, halfW: 0.6, halfD: 0.6 });
          });

          if (i >= 1 && i < TOTAL_DOORS) {
            addCloset('c-' + (closetCounter++), i, -halfW + 0.85, zCenter + 8.5, -1);
            addCloset('c-' + (closetCounter++), i, halfW - 0.85, zCenter + 3.0, 1);
            addCloset('c-' + (closetCounter++), i, -halfW + 0.85, zCenter - 3.0, -1);
            addCloset('c-' + (closetCounter++), i, halfW - 0.85, zCenter - 8.5, 1);

            // 장애물 2개 배치로 이동 경로 압박 상향
            const obsX1 = (i % 2 === 0) ? 2.1 : -2.1;
            const crate1 = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.4, 1.8), obstacleMat);
            crate1.position.set(obsX1, 0.7, zCenter + 2.5);
            scene.add(crate1);
            obstacleObjects.push({ x: obsX1, z: zCenter + 2.5, halfW: 1.45, halfD: 0.95 });

            const obsX2 = -obsX1;
            const crate2 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.4, 1.8), obstacleMat);
            crate2.position.set(obsX2, 0.7, zCenter - 4.0);
            scene.add(crate2);
            obstacleObjects.push({ x: obsX2, z: zCenter - 4.0, halfW: 1.35, halfD: 0.95 });

            // 방마다 아이템 1개 배치
            const item1Type = itemTypes[(i * 3) % itemTypes.length];
            const item1X = (i % 2 === 0) ? -5.8 : 5.8;
            spawnWorldItem('it-' + (itemCounter++), item1Type, item1X, zCenter + 4.5);
          }
        }

        // 다음 방으로 넘어가는 문 생성
        if (i < TOTAL_DOORS) {
          const doorNum = i + 1;
          const doorZ = zCenter - ROOM_LENGTH / 2;
          const nextIsMaze = MAZE_CHASE_ROOMS.includes(doorNum);
          const wallSpanW = Math.max(halfW, nextIsMaze ? MAZE_HALF_W : CORRIDOR_HALF_W);

          const sideWallW = wallSpanW - 1.35;
          const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(sideWallW, 5.6, 0.8), trimMat);
          leftFrame.position.set(-1.35 - sideWallW / 2, 2.8, doorZ);
          scene.add(leftFrame);

          const rightFrame = new THREE.Mesh(new THREE.BoxGeometry(sideWallW, 5.6, 0.8), trimMat);
          rightFrame.position.set(1.35 + sideWallW / 2, 2.8, doorZ);
          scene.add(rightFrame);

          const topFrame = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.0, 0.8), trimMat);
          topFrame.position.set(0, 4.6, doorZ);
          scene.add(topFrame);

          const pivot = new THREE.Group();
          pivot.position.set(-1.35, 0, doorZ);

          const isFinal = doorNum === TOTAL_DOORS;
          const doorMesh = new THREE.Mesh(
            new THREE.BoxGeometry(2.7, 3.6, 0.3),
            isFinal ? new THREE.MeshStandardMaterial({ color: 0x059669, emissive: 0x064e3b }) : doorWoodMat
          );
          doorMesh.position.set(1.35, 1.8, 0);
          pivot.add(doorMesh);

          const plate = new THREE.Mesh(
            new THREE.BoxGeometry(1.0, 0.5, 0.08),
            new THREE.MeshBasicMaterial({ map: createDoorNumberTexture(doorNum) })
          );
          plate.position.set(1.35, 2.55, 0.19);
          pivot.add(plate);

          scene.add(pivot);
          doorObjects.push({ doorNum, pivot, z: doorZ, opened: false });
        }

        roomDataList.push(rInfo);
      }
    }

    function triggerRoomAnomaly(roomIdx, isAmbush = false) {
      const rInfo = roomDataList[roomIdx];

      rInfo.flickerTimer = 5.0;

      playAnomalyGlassBreakSound();

    function createCuteCharacterMesh(colorHex) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.85, 16), bodyMat);
      torso.position.y = 0.55;
      group.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 16, 16), bodyMat);
      head.position.y = 1.25;
      group.add(head);

      const pack = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.55, 0.28),
        new THREE.MeshStandardMaterial({ color: 0x334155 })
      );
      pack.position.set(0, 0.65, 0.42);
      group.add(pack);

      const whiteEye = new THREE.MeshBasicMaterial({ color: 0xffffff });

      [-0.16, 0.16].forEach(ex => {

      return group;

    function applyViewModeUI() {
      const btn = document.getElementById('view-toggle-btn');
      const ch = document.getElementById('crosshair');
      if (isViewLocked) {
        viewMode = 'FIRST';
        btn.textContent = '🔒 1인칭 고정';
        btn.disabled = true;
        ch.style.display = 'block';
        return;
      }
      btn.disabled = false;
      if (viewMode === 'FIRST') {
        btn.textContent = '👁️ 1인칭 [V]';
        ch.style.display = 'block';
      } else {
        btn.textContent = '👁️ 3인칭 [V]';
        ch.style.display = 'none';
        playerPitch = 0;
      }
    }

    function toggleViewMode() {
      if (isViewLocked) {
        playWrongSound();
        return;
      }
      viewMode = viewMode === 'THIRD' ? 'FIRST' : 'THIRD';
      applyViewModeUI();
    }
    document.getElementById('view-toggle-btn').onclick = toggleViewMode;

    // 마우스 드래그 시점 회전
    let isDraggingLook = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    canvas.addEventListener('mousedown', (e) => {
      if (cutsceneActive) return;
      isDraggingLook = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    window.addEventListener('mouseup', () => {
      isDraggingLook = false;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDraggingLook || cutsceneActive) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;

      playerYaw -= dx * 0.0055;
      if (viewMode === 'FIRST') {
        playerPitch = Math.max(-0.65, Math.min(0.65, playerPitch - dy * 0.0045));
      }
    });

    // 모바일 화면 우측 터치 드래그 시점 회전
    let touchLookId = null;
    let lastTouchX = 0;
    let lastTouchY = 0;
    canvas.addEventListener('touchstart', (e) => {
      if (cutsceneActive) return;
      for (const t of e.changedTouches) {
        if (t.clientX > window.innerWidth * 0.35 && touchLookId === null) {
          touchLookId = t.identifier;
          lastTouchX = t.clientX;
          lastTouchY = t.clientY;
        }
      }
    });
    canvas.addEventListener('touchmove', (e) => {
      if (cutsceneActive) return;
      for (const t of e.changedTouches) {
        if (t.identifier === touchLookId) {
          const dx = t.clientX - lastTouchX;
          const dy = t.clientY - lastTouchY;
          lastTouchX = t.clientX;
          lastTouchY = t.clientY;
          playerYaw -= dx * 0.007;
          if (viewMode === 'FIRST') {
            playerPitch = Math.max(-0.65, Math.min(0.65, playerPitch - dy * 0.005));
          }
        }
      }
    });
    canvas.addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === touchLookId) touchLookId = null;
      }
    });

    function ensurePlayerVisual(id, data) {
      if (!playerMeshes[id]) {
        const mesh = createCuteCharacterMesh(data.color || '#38bdf8');
        scene.add(mesh);
        playerMeshes[id] = mesh;

        const wrap = document.createElement('div');
        wrap.className = 'tag-wrapper';
        wrap.innerHTML = `<div class="emote-bubble" style="display:none;"></div><div class="nametag"></div>`;
        document.getElementById('nametags-container').appendChild(wrap);
        tagWrappers[id] = wrap;
      }

      const mesh = playerMeshes[id];
      const hideMyMeshInFirstPerson = (id === myId && viewMode === 'FIRST');
      mesh.visible = !data.hiddenClosetId && !hideMyMeshInFirstPerson;
      mesh.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.transparent = !!data.ghost;
          child.material.opacity = data.ghost ? 0.42 : 1.0;
        }
      });

      const wrap = tagWrappers[id];
      const tag = wrap.querySelector('.nametag');
      tag.textContent = (data.ghost ? '👻 ' : '') + data.name;

      const bubble = wrap.querySelector('.emote-bubble');
      if (data.emote && Date.now() - data.emoteTime < 2600) {
        bubble.textContent = data.emote;
        bubble.style.display = 'block';
      } else {
        bubble.style.display = 'none';
      }
    }

    function updatePlayerListUI() {
      const container = document.getElementById('player-list-items');
      container.innerHTML = '';
      Object.entries(players).forEach(([id, p]) => {
        const div = document.createElement('div');
        div.className = 'player-item';
        div.innerHTML = `<span class="dot-mini" style="background:${p.color}"></span>
          <span>${p.name} ${p.ghost ? '👻' : ''}</span>`;
        container.appendChild(div);
      });
    }

    function triggerEmote(emoteChar, animType) {
      if (!players[myId] || gamePhase === 'MENU') return;
      playEmoteSound();
      players[myId].emote = emoteChar;
      players[myId].emoteAnim = animType;
      players[myId].emoteTime = Date.now();
      ensurePlayerVisual(myId, players[myId]);

      if (!isHost && hostConn && hostConn.open) {
        hostConn.send({ type: 'EMOTE', emote: emoteChar, anim: animType });
      }
    }

    document.querySelectorAll('.emote-btn').forEach(btn => {
      btn.onclick = () => triggerEmote(btn.dataset.emote, btn.dataset.anim);
    });

          iconEl.textContent = '';
          labelEl.textContent = '';
        }
      }
    }

    function updateBuffsHUD() {
      const parts = [];
      if (hasShield) parts.push('🕯️보호');
      if (lanternTimer > 0) parts.push(`🔦${Math.ceil(lanternTimer)}s`);
      if (speedBoostTimer > 0) parts.push(`🥤${Math.ceil(speedBoostTimer)}s`);
      if (hiddenClosetId) parts.push(`🫁${Math.max(0, MAX_CLOSET_TIME - closetStayTimer).toFixed(1)}s`);
      document.getElementById('hud-buffs').textContent = parts.join(' ');
    }

    function useInventorySlot(slotIdx) {
      if (gamePhase !== 'PLAYING' || isGhost || cutsceneActive) return;
      const itemType = inventory[slotIdx];
      if (!itemType) return;

      if (itemType === 'LANTERN') {
        lanternTimer = 25;
        inventory.splice(slotIdx, 1);
        playItemUseSound();
      } else if (itemType === 'DRINK') {
        speedBoostTimer = 12;
        inventory.splice(slotIdx, 1);
        playItemUseSound();
      } else if (itemType === 'MEDKIT') {
        if (hearts >= 3) {
          playWrongSound();
          return;
        }
        hearts = Math.min(3, hearts + 1);
        document.getElementById('hud-hearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);
        inventory.splice(slotIdx, 1);
        playItemUseSound();
      } else if (itemType === 'SHIELD') {
        if (hasShield) {
          playWrongSound();
          return;
        }
        hasShield = true;
        inventory.splice(slotIdx, 1);
        playItemUseSound();
      } else if (itemType === 'KEY') {
        const me = players[myId];
        const nextDoor = doorObjects.find(d => d.doorNum === unlockedDoor + 1);
        if (me && nextDoor && Math.hypot(me.x - 0, me.z - nextDoor.z) < 3.4) {
          inventory.splice(slotIdx, 1);
          playItemUseSound();
          closeQuizModal();
          sendToHost({ type: 'OPEN_DOOR', doorNum: nextDoor.doorNum });
        } else {
          playWrongSound();
          return;
        }
      }
      renderInventoryUI();
      updateBuffsHUD();
    }
    window.useInventorySlot = useInventorySlot;

    function markItemCollectedLocal(itemId) {
      const it = itemObjects.find(o => o.id === itemId);
      if (it && !it.collected) {
        it.collected = true;
        it.orb.visible = false;
        it.ring.visible = false;
      }
    }

    // ==========================================
    // 8. 온라인 멀티플레이어 (PeerJS WebRTC)
    // ==========================================
    const colorDots = document.querySelectorAll('.color-dot');
    colorDots.forEach(dot => {
      dot.onclick = () => {
        colorDots.forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
        myColor = dot.dataset.color;
      };
    });

    function initLocalPlayer() {
      const rawName = document.getElementById('nickname-input').value.trim();
      myName = rawName || '탐험가' + Math.floor(10 + Math.random() * 89);
      players[myId] = {
        name: myName,
        color: myColor,
        x: 0,
        z: 4,
        yaw: 0,
        hiddenClosetId: null,
        ghost: false,
        emote: '',
        emoteAnim: '',
        emoteTime: 0
      };
      ensurePlayerVisual(myId, players[myId]);
      updatePlayerListUI();
    }

    function enterGameScreen() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('bottom-bars').style.display = 'flex';
      document.getElementById('hud-room-code').textContent = roomCode;
      if ('ontouchstart' in window || window.innerWidth < 820) {
        document.getElementById('mobile-controls').style.display = 'flex';
      }
      gamePhase = 'LOBBY';
      if (isHost) {
        document.getElementById('lobby-banner').style.display = 'block';
      }
    }

    function broadcastFromHost(payload) {
      if (!isHost) return;
      connections.forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    function sendToHost(payload) {
      if (isHost) {
        handleNetworkMessage(myId, payload);
      } else if (hostConn && hostConn.open) {
        hostConn.send(payload);
      }
    }

    document.getElementById('create-room-btn').onclick = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isHost = true;
      roomCode = String(Math.floor(1000 + Math.random() * 9000));
      const peerId = 'doors6-v4-' + roomCode;
      document.getElementById('status-dot').textContent = '...';

      peer = new Peer(peerId);
      peer.on('open', (id) => {
        myId = id;
        initLocalPlayer();
        enterGameScreen();
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleNetworkMessage(conn.peer, data));
        conn.on('close', () => {
          delete players[conn.peer];
          if (playerMeshes[conn.peer]) {
            scene.remove(playerMeshes[conn.peer]);
            delete playerMeshes[conn.peer];
          }
          if (tagWrappers[conn.peer]) {
            tagWrappers[conn.peer].remove();
            delete tagWrappers[conn.peer];
          }
          updatePlayerListUI();
        });
      });

      peer.on('error', () => {
        initLocalPlayer();
        enterGameScreen();
      });
    };

    document.getElementById('join-room-btn').onclick = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const code = document.getElementById('room-code-input').value.trim();
      if (code.length !== 4) return;
      isHost = false;
      roomCode = code;
      document.getElementById('status-dot').textContent = '...';

      peer = new Peer();
      peer.on('open', (id) => {
        myId = id;
        initLocalPlayer();
        hostConn = peer.connect('doors6-v4-' + roomCode);

        hostConn.on('open', () => {
          enterGameScreen();
          hostConn.send({ type: 'JOIN', player: players[myId] });
        });

        hostConn.on('data', (data) => handleClientReceive(data));
      });
    };

    document.getElementById('copy-code-btn').onclick = () => {
      navigator.clipboard?.writeText(roomCode);
      document.getElementById('copy-code-btn').textContent = '✓';
      setTimeout(() => document.getElementById('copy-code-btn').textContent = '복사', 1200);
    };

    document.getElementById('start-game-btn').onclick = () => {
      if (!isHost) return;
      gamePhase = 'PLAYING';
      document.getElementById('lobby-banner').style.display = 'none';
      broadcastFromHost({ type: 'GAME_START' });
    };

    function getClosetOccupantCount(closetId) {
      let count = 0;
      Object.values(players).forEach(p => {
        if (p.hiddenClosetId === closetId) count++;
      });
      return count;
    }

    function handleNetworkMessage(senderId, data) {
      if (data.type === 'JOIN') {
        players[senderId] = data.player;
        ensurePlayerVisual(senderId, data.player);
        updatePlayerListUI();
        broadcastFromHost({ type: 'SYNC_ALL', players, unlockedDoor, gamePhase, chaseActive });
      } else if (data.type === 'MOVE') {
        if (players[senderId]) {
          players[senderId].x = data.x;
          players[senderId].z = data.z;
          players[senderId].yaw = data.yaw || 0;
          players[senderId].hiddenClosetId = data.hiddenClosetId;
          players[senderId].ghost = data.ghost;
        }
      } else if (data.type === 'EMOTE') {
        if (players[senderId]) {
          players[senderId].emote = data.emote;
          players[senderId].emoteAnim = data.anim;
          players[senderId].emoteTime = Date.now();
        }
      } else if (data.type === 'PICKUP_ITEM') {
        markItemCollectedLocal(data.itemId);
        broadcastFromHost({ type: 'ITEM_COLLECTED', itemId: data.itemId });
      } else if (data.type === 'OPEN_DOOR') {
        hostOpenDoor(data.doorNum);
      }
    }

    function handleClientReceive(data) {
      if (data.type === 'GAME_START') {
        gamePhase = 'PLAYING';
        document.getElementById('lobby-banner').style.display = 'none';
      } else if (data.type === 'SYNC_ALL') {
        Object.entries(data.players).forEach(([id, p]) => {
          if (id !== myId) {
            players[id] = p;
            ensurePlayerVisual(id, p);
          }
        });
        updatePlayerListUI();
        if (data.unlockedDoor > unlockedDoor) {
          for (let d = unlockedDoor + 1; d <= data.unlockedDoor; d++) {
            applyDoorOpenedLocal(d, false);
          }
        }
        if (data.gamePhase === 'PLAYING' && gamePhase === 'LOBBY') {
          gamePhase = 'PLAYING';
          document.getElementById('lobby-banner').style.display = 'none';
        }
      } else if (data.type === 'DOOR_OPENED') {
        applyDoorOpenedLocal(data.doorNum, true);
      } else if (data.type === 'ITEM_COLLECTED') {
        markItemCollectedLocal(data.itemId);
      } else if (data.type === 'MONSTER_EVENT') {
        if (data.kind === 'SINGLE') {
          triggerRushSequence(data.doorNum, 'SINGLE', 1);
        } else if (data.kind === 'AMBUSH') {
          triggerRushSequence(data.doorNum, 'AMBUSH', data.passes || 3);
        } else if (data.kind === 'CHASE') {
          startMazeChaseWithCutscene(data.doorNum);
        }
      }
    }

    setInterval(() => {
      if (!players[myId] || gamePhase === 'MENU') return;
      if (isHost) {
        broadcastFromHost({ type: 'SYNC_ALL', players, unlockedDoor, gamePhase, chaseActive });
      } else if (hostConn && hostConn.open) {
        hostConn.send({
          type: 'MOVE',
          x: players[myId].x,
          z: players[myId].z,
          yaw: playerYaw,
          hiddenClosetId: hiddenClosetId,
          ghost: isGhost
        });
      }
    }, 60);

    // ==========================================
    // 9. 초6 퀴즈 (14초 제한시간), 몬스터 패턴 & 1인칭 컷신 미로 추격전
    // ==========================================
    let usedQuizIndices = new Set();
    let quizTimerRemaining = 0;
    let quizOpen = false;

    function closeQuizModal() {
      quizOpen = false;
      document.getElementById('quiz-modal').style.display = 'none';
    }

    function openQuizForDoor(doorNum) {
      if (chaseActive || rushState !== 'NONE' || cutsceneActive) return;

      let idx;
      if (usedQuizIndices.size >= GRADE6_QUIZZES.length) usedQuizIndices.clear();
      do {
        idx = Math.floor(Math.random() * GRADE6_QUIZZES.length);
      } while (usedQuizIndices.has(idx));
      usedQuizIndices.add(idx);

      const qObj = GRADE6_QUIZZES[idx];
      document.getElementById('quiz-subject').textContent = qObj.subject;
      document.getElementById('quiz-door-tag').textContent = `DOOR #${String(doorNum).padStart(2, '0')}`;
      document.getElementById('quiz-question').textContent = qObj.q;
      document.getElementById('quiz-feedback').textContent = '';

      quizTimerRemaining = QUIZ_TIME_LIMIT;
      quizOpen = true;
      document.getElementById('quiz-timer-fill').style.width = '100%';

      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';

      qObj.opts.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = `${i + 1}. ${optText}`;
        btn.onclick = () => {
          if (!quizOpen) return;
          if (i === qObj.ans) {
            playCorrectSound();
            quizOpen = false;
            document.getElementById('quiz-feedback').style.color = '#4ade80';
            document.getElementById('quiz-feedback').textContent = 'O';
            setTimeout(() => {
              closeQuizModal();
              sendToHost({ type: 'OPEN_DOOR', doorNum });
            }, 240);
          } else {
            playWrongSound();
            document.getElementById('quiz-feedback').style.color = '#f87171';
            document.getElementById('quiz-feedback').textContent = 'X (-❤️)';
            takeDamage();
          }
        };
        optsContainer.appendChild(btn);
      });

      document.getElementById('quiz-modal').style.display = 'flex';
    }

    document.getElementById('quiz-close-btn').onclick = closeQuizModal;

    function hostOpenDoor(doorNum) {
      if (doorNum <= unlockedDoor) return;
      applyDoorOpenedLocal(doorNum, true);
      broadcastFromHost({ type: 'DOOR_OPENED', doorNum });

      if (doorNum >= TOTAL_DOORS) return;

      // 미로 추격전 구간 (8~10, 17~19) 진입 / 진행 / 탈출 판정
      if (MAZE_CHASE_ROOMS.includes(doorNum)) {
        if (!chaseActive) {
          startMazeChaseWithCutscene(doorNum);
          broadcastFromHost({ type: 'MONSTER_EVENT', kind: 'CHASE', doorNum });
        }
        return;
      } else if (chaseActive) {
        endMazeChaseEvent();
        return;
      }

      // 일반 구간: 90% 확률로 몬스터 출현 (단발 초고속 러시 or 3~4회 왕복 앰부시)
      if (doorNum >= 1 && Math.random() < MONSTER_SPAWN_CHANCE) {
        if (Math.random() < 0.52) {
          const passes = Math.random() < 0.5 ? 3 : 4; // 3~4회 왕복으로 난이도 상향
          triggerRushSequence(doorNum, 'AMBUSH', passes);
          broadcastFromHost({ type: 'MONSTER_EVENT', kind: 'AMBUSH', doorNum, passes });
        } else {
          triggerRushSequence(doorNum, 'SINGLE', 1);
          broadcastFromHost({ type: 'MONSTER_EVENT', kind: 'SINGLE', doorNum });
        }
      }
    }

    function applyDoorOpenedLocal(doorNum, playFx) {
      if (doorNum <= unlockedDoor) return;
      unlockedDoor = doorNum;
      document.getElementById('hud-door-num').textContent = String(doorNum).padStart(2, '0');
      const doorObj = doorObjects.find(d => d.doorNum === doorNum);
      if (doorObj) doorObj.opened = true;
      if (playFx) playDoorSound();

      if (!MAZE_CHASE_ROOMS.includes(doorNum) && chaseActive) {
        endMazeChaseEvent();
      }

      if (doorNum >= TOTAL_DOORS) {
        chaseActive = false;
        chaseMesh.visible = false;
        isViewLocked = false;
        applyViewModeUI();
        setTimeout(() => {
          gamePhase = 'VICTORY';
          document.getElementById('end-title').textContent = 'ESCAPE CLEAR!';
          document.getElementById('end-modal').style.display = 'flex';
        }, 700);
      }
    }

    // 몬스터 패턴 1 & 2: 단발 러시 및 3~4회 왕복 앰부시
    function triggerRushSequence(doorNum, mode, passes) {
      if (rushState !== 'NONE') return;
      rushState = 'ANOMALY';
      rushMode = mode;
      rushPassesLeft = passes;
      rushHitThisLeg = false;

      const isAmbush = mode === 'AMBUSH';
      rushCoreMat.color.setHex(isAmbush ? 0x042f2e : 0x090514);
      rushAuraMat.color.setHex(isAmbush ? 0x10b981 : 0x6d28d9);

      triggerRoomAnomaly(doorNum, isAmbush);
      triggerRoomAnomaly(Math.max(0, doorNum - 1), isAmbush);

      // 1.15초 후 초고속 돌진 (반응 시간 단축으로 긴장감 강화)
      setTimeout(() => {
        rushState = 'CHARGING';
        rushDir = 1;
        rushMonsterZ = -(unlockedDoor + 3) * ROOM_LENGTH;
        rushMesh.visible = true;
        rushMesh.position.set(0, 2.4, rushMonsterZ);
        playRushPassSound();
      }, 1150);
    }

    // 몬스터 패턴 3: 미로 추격전 시작 + 1인칭 컷신 & 1인칭 고정
    function startMazeChaseWithCutscene(doorNum) {
      chaseActive = true;
      cutsceneActive = true;
      cutsceneTimer = 3.2;
      cutsceneDoorNum = doorNum;

      // 1인칭 강제 전환 및 고정!
      viewMode = 'FIRST';
      isViewLocked = true;
      playerYaw = 0;
      playerPitch = 0;
      applyViewModeUI();
      document.body.classList.add('in-cutscene');

      const entryDoorZ = -(doorNum - 0.5) * ROOM_LENGTH; // doorNum 문 위치
      if (players[myId]) {
        players[myId].x = 0;
        players[myId].z = entryDoorZ - 1.8; // 미로 입구 안쪽으로 위치 정렬
        cutsceneStartX = players[myId].x;
        cutsceneStartZ = players[myId].z;
      }

      // 몬스터는 미로 입구 바로 뒤편에서 출현
      chaseMonsterX = 0;
      chaseMonsterZ = entryDoorZ + 3.8;
      chaseMesh.position.set(chaseMonsterX, 0, chaseMonsterZ);
      chaseMesh.visible = true;
      playerTrail = [{ x: 0, z: entryDoorZ - 1.8 }];

      triggerRoomAnomaly(doorNum, false);
      playCutsceneRoarSound();
      document.getElementById('vignette').classList.add('anomaly');
    }

    function endMazeChaseEvent() {
      chaseActive = false;
      cutsceneActive = false;
      chaseMesh.visible = false;
      playerTrail = [];
      document.body.classList.remove('in-cutscene');
      document.getElementById('vignette').classList.remove('anomaly');

      // 추격전 종료 시 1인칭 고정 해제
      isViewLocked = false;
      applyViewModeUI();
      playCorrectSound();
    }

    function takeDamage() {
      if (isGhost) return;

      if (hasShield) {
        hasShield = false;
        updateBuffsHUD();
        playItemUseSound();
        cameraShake = 0.45;
        return;
      }

      hearts = Math.max(0, hearts - 1);
      playWrongSound();
      cameraShake = 0.7;
      document.getElementById('hud-hearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);

      if (hearts === 0) {
        isGhost = true;
        players[myId].ghost = true;
        closeQuizModal();
      }
    }

    // ==========================================
    // 10. 입력 처리
    // ==========================================
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyE' || e.code === 'Space') {
        if (quizOpen || cutsceneActive) return;
        handleInteract();
      } else if (e.code === 'KeyV') {
        if (gamePhase !== 'MENU' && !cutsceneActive) toggleViewMode();
      } else if (e.code === 'KeyZ') {
        useInventorySlot(0);
      } else if (e.code === 'KeyX') {
        useInventorySlot(1);
      } else if (e.code === 'KeyC') {
        useInventorySlot(2);
      } else if (e.code === 'Escape') {
        closeQuizModal();
      } else if (e.code === 'Digit1') {
        triggerEmote('👋', 'wave');
      } else if (e.code === 'Digit2') {
        triggerEmote('😱', 'scared');
      } else if (e.code === 'Digit3') {
        triggerEmote('🏃', 'hurry');
      } else if (e.code === 'Digit4') {
        triggerEmote('🤫', 'hide');
      } else if (e.code === 'Digit5') {
        triggerEmote('🎉', 'spin');
      } else if (e.code === 'Digit6') {
        triggerEmote('😭', 'cry');
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    document.querySelectorAll('.pad-btn').forEach(btn => {
      const k = btn.dataset.key;
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
      btn.addEventListener('mousedown', () => { keys[k] = true; });
      btn.addEventListener('mouseup', () => { keys[k] = false; });
    });
    document.getElementById('touch-action-btn').onclick = handleInteract;
    document.getElementById('interact-prompt').onclick = handleInteract;

    let nearbyTarget = null;

    function handleInteract() {
      if (gamePhase !== 'PLAYING' || !players[myId] || cutsceneActive) return;

      if (hiddenClosetId) {
        hiddenClosetId = null;
        closetStayTimer = 0;
        players[myId].hiddenClosetId = null;
        playTone(280, 'sine', 0.14, 0.1);
        return;
      }

      if (!nearbyTarget) return;

      if (nearbyTarget.type === 'ITEM') {
        if (inventory.length >= MAX_INVENTORY) {
          playWrongSound();
          return;
        }
        const it = nearbyTarget.obj;
        if (it.collected) return;
        inventory.push(it.type);
        renderInventoryUI();
        playItemPickupSound();
        markItemCollectedLocal(it.id);
        sendToHost({ type: 'PICKUP_ITEM', itemId: it.id });
      } else if (nearbyTarget.type === 'CLOSET') {
        const cObj = nearbyTarget.obj;
        const currentCount = getClosetOccupantCount(cObj.id);
        if (currentCount >= CLOSET_CAPACITY) {
          playWrongSound();
          return;
        }
        hiddenClosetId = cObj.id;
        closetStayTimer = 0;
        players[myId].hiddenClosetId = cObj.id;
        players[myId].x = cObj.x;
        players[myId].z = cObj.z;
        playTone(210, 'sine', 0.18, 0.12);
      } else if (nearbyTarget.type === 'DOOR') {
        const dNum = nearbyTarget.obj.doorNum;
        if (dNum !== unlockedDoor + 1) return;

        if (chaseActive || rushState !== 'NONE') {
          sendToHost({ type: 'OPEN_DOOR', doorNum: dNum });
        } else {
          openQuizForDoor(dNum);
        }
      }
    }

    // 벽 슬라이딩 충돌 검사 헬퍼
    function canOccupyPosition(x, z, halfWLimit, nextClosedDoorZ) {
      if (x < -halfWLimit + 0.65 || x > halfWLimit - 0.65) return false;
      if (z > 12.0) return false;
      if (nextClosedDoorZ !== null && z < nextClosedDoorZ + 0.68) return false;
      if (gamePhase === 'LOBBY' && z < -ROOM_LENGTH / 2 + 0.9) return false;

      const r = 0.35; // 플레이어 충돌 반경
      for (const obs of obstacleObjects) {
        if (Math.abs(x - obs.x) < obs.halfW + r && Math.abs(z - obs.z) < obs.halfD + r) {
          return false;
        }
      }
      return true;
    }

    // ==========================================
    // 11. 메인 게임 루프
    // ==========================================
    const clock = new THREE.Clock();
    let rushTurnPause = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 퀴즈 제한시간 카운트다운
      if (quizOpen) {
        quizTimerRemaining -= dt;
        const pct = Math.max(0, (quizTimerRemaining / QUIZ_TIME_LIMIT) * 100);
        document.getElementById('quiz-timer-fill').style.width = pct + '%';
        if (quizTimerRemaining <= 0) {
          quizOpen = false;
          closeQuizModal();
          takeDamage();
        }
      }

      // 옷장 숨참기 한계 타이머 (난이도 상향)
      if (hiddenClosetId && !isGhost) {
        closetStayTimer += dt;
        if (closetStayTimer > MAX_CLOSET_TIME - 2.2) {
          cameraShake = Math.max(cameraShake, 0.25);
        }
        if (closetStayTimer >= MAX_CLOSET_TIME) {
          hiddenClosetId = null;
          closetStayTimer = 0;
          if (players[myId]) players[myId].hiddenClosetId = null;
          takeDamage();
        }
        updateBuffsHUD();
      }

      // 버프 타이머 갱신
      if (lanternTimer > 0) {
        lanternTimer = Math.max(0, lanternTimer - dt);
        updateBuffsHUD();
      }
      if (speedBoostTimer > 0) {
        speedBoostTimer = Math.max(0, speedBoostTimer - dt);
        updateBuffsHUD();
      }

      // 1) 문 애니메이션
      doorObjects.forEach(d => {
        const targetRot = d.opened ? -Math.PI * 0.55 : 0;
        d.pivot.rotation.y += (targetRot - d.pivot.rotation.y) * 9 * dt;
      });

      // 2) 옷장 LED 점 업데이트 (최대 2인)
      closetObjects.forEach(c => {
        const occ = getClosetOccupantCount(c.id);
        const isFull = occ >= CLOSET_CAPACITY;
        c.dots.forEach((dot, idx) => {
          if (isFull) {
            dot.material.color.setHex(0xef4444);
          } else if (idx < occ) {
            dot.material.color.setHex(0xfbbf24);
          } else {
            dot.material.color.setHex(0x38bdf8);
          }
        });
      });

      // 3) 월드 아이템 & 인도하는 빛 애니메이션
      itemObjects.forEach(it => {
        if (!it.collected) {
          it.orb.rotation.y += 2.4 * dt;
          it.orb.position.y = 1.22 + Math.sin(elapsed * 3.5) * 0.1;
        }
      });
      guidingOrbs.forEach((g, idx) => {
        g.position.y = 0.22 + Math.sin(elapsed * 4 + idx) * 0.06;
      });

      // 4) 유리/스파크 파티클 업데이트
      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const sp = sparkParticles[i];
        sp.life -= dt;
        sp.vy -= 9.8 * dt;
        sp.mesh.position.x += sp.vx * dt;
        sp.mesh.position.y += sp.vy * dt;
        sp.mesh.position.z += sp.vz * dt;
        if (sp.mesh.position.y < 0.05) {
          sp.mesh.position.y = 0.05;
          sp.vy *= -0.35;
        }
        if (sp.life <= 0) {
          scene.remove(sp.mesh);
          sparkParticles.splice(i, 1);
        }
      }

      // 5) 이상현상 전등 깜빡임
      roomDataList.forEach(r => {
        if (r.flickerTimer > 0) {
          r.flickerTimer -= dt;
          r.lamps.forEach(lamp => {
            lamp.light.intensity = Math.random() > 0.42 ? 1.4 : 0.02;
          });
          r.paintings.forEach(p => {
            p.rotation.z = Math.sin(elapsed * 45) * 0.08;
          });
          if (r.flickerTimer <= 0) {
            r.lamps.forEach(lamp => {
              lamp.light.intensity = lamp.broken ? 0.2 : 0.65;
            });
            r.paintings.forEach(p => { p.rotation.z = 0; });
          }
        }
      });

      // 6) 내 캐릭터 이동 & 1인칭 컷신 / 1인칭·3인칭 카메라
      if (players[myId] && (gamePhase === 'LOBBY' || gamePhase === 'PLAYING')) {
        const me = players[myId];

        if (cutsceneActive) {
          // 1인칭 시네마틱 컷신 진행 (3.2초 동안 시점 연출 후 1인칭 고정 상태로 조작 복귀)
          cutsceneTimer -= dt;
          const progress = Math.min(1, (3.2 - cutsceneTimer) / 3.2);
          cameraShake = Math.max(cameraShake, 0.22);

          if (progress < 0.35) {
            // 1단계: 미로 입구 안쪽으로 한 걸음 들어서며 어두운 미로 벽을 둘러봄
            const t = progress / 0.35;
            const cx = cutsceneStartX;
            const cz = cutsceneStartZ - t * 1.6;
            const yaw = Math.sin(t * Math.PI) * 0.45;
            camera.position.set(cx, 1.52, cz);
            camera.lookAt(cx - Math.sin(yaw) * 8, 1.55, cz - Math.cos(yaw) * 8);
          } else if (progress < 0.78) {
            // 2단계: 뒤를 돌아보며 미로 입구에서 괴물이 솟아오르는 장면 목격!
            const t = (progress - 0.35) / 0.43;
            const cx = cutsceneStartX;
            const cz = cutsceneStartZ - 1.6;
            const turnYaw = Math.min(Math.PI, t * Math.PI * 1.25);
            chaseMesh.position.y = -2.2 + Math.min(1, t * 1.4) * 2.2;
            camera.position.set(cx, 1.52, cz);
            camera.lookAt(cx - Math.sin(turnYaw) * 6, 1.85, cz - Math.cos(turnYaw) * 6);
          } else {
            // 3단계: 다시 정면(미로 안쪽)으로 급회전하며 조작 시작!
            const t = (progress - 0.78) / 0.22;
            const cx = cutsceneStartX;
            const cz = cutsceneStartZ - 1.6;
            const snapYaw = Math.PI * (1 - t);
            chaseMesh.position.y = 0;
            camera.position.set(cx, 1.52, cz);
            camera.lookAt(cx - Math.sin(snapYaw) * 8, 1.52, cz - Math.cos(snapYaw) * 8);
          }

          if (cutsceneTimer <= 0) {
            cutsceneActive = false;
            document.body.classList.remove('in-cutscene');
            me.x = cutsceneStartX;
            me.z = cutsceneStartZ - 1.6;
            playerYaw = 0;
            playerPitch = 0;
            playerTrail = [{ x: me.x, z: me.z }];
          }
        } else {
          // 일반 플레이 이동 (1인칭/3인칭)
          if (keys['KeyQ']) playerYaw += 2.3 * dt;
          me.yaw = playerYaw;

          if (!hiddenClosetId && !quizOpen) {
            let forwardInput = 0;
            let strafeInput = 0;
            if (keys['KeyW'] || keys['ArrowUp']) forwardInput += 1;
            if (keys['KeyS'] || keys['ArrowDown']) forwardInput -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) strafeInput += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) strafeInput -= 1;

            if (forwardInput !== 0 || strafeInput !== 0) {
              const len = Math.hypot(forwardInput, strafeInput);
              const fNorm = forwardInput / len;
              const sNorm = strafeInput / len;

              const baseSpeed = chaseActive ? 7.5 : 6.8;
              const mult = speedBoostTimer > 0 ? 1.4 : 1.0;
              const speed = baseSpeed * mult;

              const sinY = Math.sin(playerYaw);
              const cosY = Math.cos(playerYaw);
              const moveX = (-sinY * fNorm + cosY * sNorm);
              const moveZ = (-cosY * fNorm - sinY * sNorm);

              const curRoomIdx = Math.max(0, Math.round(-me.z / ROOM_LENGTH));
              const halfWLimit = MAZE_CHASE_ROOMS.includes(curRoomIdx) ? MAZE_HALF_W : CORRIDOR_HALF_W;
              const nextClosedDoor = doorObjects.find(d => d.doorNum === unlockedDoor + 1);
              const nextDoorZ = nextClosedDoor ? nextClosedDoor.z : null;

              // 벽 슬라이딩 이동 (미로 코너를 부드럽게 통과)
              const tryX = me.x + moveX * speed * dt;
              if (canOccupyPosition(tryX, me.z, halfWLimit, nextDoorZ)) {
                me.x = tryX;
              }
              const tryZ = me.z + moveZ * speed * dt;
              if (canOccupyPosition(me.x, tryZ, halfWLimit, nextDoorZ)) {
                me.z = tryZ;
              }

              // 미로 추격전 중 몬스터 추적 궤적 기록
              if (chaseActive) {
                const lastPt = playerTrail[playerTrail.length - 1];
                if (!lastPt || Math.hypot(me.x - lastPt.x, me.z - lastPt.z) > 0.55) {
                  playerTrail.push({ x: me.x, z: me.z });
                  if (playerTrail.length > 260) playerTrail.shift();
                }
              }
            }
          }

          // 미로 추격전 중에는 다음 문에 가까이 가면 자동으로 문이 열려 긴박한 1인칭 도주 유지
          if (chaseActive && gamePhase === 'PLAYING') {
            const nextDoor = doorObjects.find(d => d.doorNum === unlockedDoor + 1);
            if (nextDoor && Math.hypot(me.x - 0, me.z - nextDoor.z) < 2.2) {
              sendToHost({ type: 'OPEN_DOOR', doorNum: nextDoor.doorNum });
            }
          }

          // 주변 상호작용 감지
          nearbyTarget = null;
          const promptEl = document.getElementById('interact-prompt');
          promptEl.classList.remove('full');

          if (gamePhase === 'PLAYING') {
            if (hiddenClosetId) {
              promptEl.textContent = '[E] 나오기';
              promptEl.style.display = 'block';
            } else {
              let bestDist = 2.5;

              for (const it of itemObjects) {
                if (it.collected) continue;
                const dist = Math.hypot(me.x - it.x, me.z - it.z);
                if (dist < bestDist) {
                  bestDist = dist;
                  nearbyTarget = { type: 'ITEM', obj: it };
                }
              }

              for (const c of closetObjects) {
                const dist = Math.hypot(me.x - c.x, me.z - c.z);
                if (dist < bestDist) {
                  bestDist = dist;
                  nearbyTarget = { type: 'CLOSET', obj: c };
                }
              }

              const nextDoor = doorObjects.find(d => d.doorNum === unlockedDoor + 1);
              if (nextDoor && Math.hypot(me.x - 0, me.z - nextDoor.z) < 2.8) {
                nearbyTarget = { type: 'DOOR', obj: nextDoor };
              }

              if (nearbyTarget) {
                if (nearbyTarget.type === 'ITEM') {
                  const def = ITEM_DEFS[nearbyTarget.obj.type];
                  if (inventory.length >= MAX_INVENTORY) {
                    promptEl.textContent = `FULL (${inventory.length}/${MAX_INVENTORY})`;
                    promptEl.classList.add('full');
                  } else {
                    promptEl.textContent = `[E] ${def.icon} ${def.label}`;
                  }
                } else if (nearbyTarget.type === 'CLOSET') {
                  const occ = getClosetOccupantCount(nearbyTarget.obj.id);
                  if (occ >= CLOSET_CAPACITY) {
                    promptEl.textContent = `MAX (${occ}/${CLOSET_CAPACITY})`;
                    promptEl.classList.add('full');
                  } else {
                    promptEl.textContent = `[E] (${occ}/${CLOSET_CAPACITY})`;
                  }
                } else {
                  promptEl.textContent = `[E] ${String(nearbyTarget.obj.doorNum).padStart(4, '0')}`;
                }
                promptEl.style.display = 'block';
              } else {
                promptEl.style.display = 'none';
              }
            }
          }

          // 카메라 위치 & 각도 업데이트 (1인칭 vs 3인칭)
          cameraShake = Math.max(0, cameraShake - dt * 1.4);
          const shakeX = (Math.random() - 0.5) * cameraShake;
          const shakeY = (Math.random() - 0.5) * cameraShake;

          const sinY = Math.sin(playerYaw);
          const cosY = Math.cos(playerYaw);

          if (viewMode === 'FIRST') {
            const eyeY = hiddenClosetId ? 1.65 : 1.48;
            camera.position.set(me.x + shakeX * 0.5, eyeY + shakeY * 0.5, me.z);
            const lookDist = 10;
            const lx = me.x - sinY * lookDist;
            const lz = me.z - cosY * lookDist;
            const ly = eyeY + Math.sin(playerPitch) * lookDist;
            camera.lookAt(lx, ly, lz);
          } else {
            const camDist = 6.8;
            const targetCamX = me.x + sinY * camDist;
            const targetCamZ = me.z + cosY * camDist;
            camera.position.x += (targetCamX - camera.position.x) * 7 * dt + shakeX;
            camera.position.z += (targetCamZ - camera.position.z) * 7 * dt;
            camera.position.y = 4.4 + shakeY;

            const lookAhead = 5.5;
            camera.lookAt(me.x - sinY * lookAhead, 1.35, me.z - cosY * lookAhead);
          }
        }

        // 플레이어 손전등/랜턴 조명
        if (lanternTimer > 0) {
          playerLight.intensity = 2.3;
          playerLight.distance = 44;
        } else {
          playerLight.intensity = 1.25;
          playerLight.distance = 22;
        }
        playerLight.position.set(me.x, 2.5, me.z);
      }

      // 7) 모든 플레이어 3D 캐릭터 & 감정표현 업데이트
      Object.entries(players).forEach(([id, p]) => {
        ensurePlayerVisual(id, p);
        const mesh = playerMeshes[id];
        mesh.position.x += (p.x - mesh.position.x) * 14 * dt;
        mesh.position.z += (p.z - mesh.position.z) * 14 * dt;

        const emoteElapsed = (Date.now() - (p.emoteTime || 0)) / 1000;
        let extraY = 0;
        mesh.rotation.y = p.yaw || 0;
        mesh.rotation.z = 0;

        if (emoteElapsed < 2.2) {
          if (p.emoteAnim === 'wave' || p.emoteAnim === 'hurry') {
            extraY = Math.abs(Math.sin(elapsed * 14)) * 0.45;
          } else if (p.emoteAnim === 'spin') {
            extraY = Math.abs(Math.sin(elapsed * 10)) * 0.35;
            mesh.rotation.y = elapsed * 10;
          } else if (p.emoteAnim === 'scared' || p.emoteAnim === 'cry') {
            mesh.rotation.z = Math.sin(elapsed * 32) * 0.16;
          }
        }

        mesh.position.y = (p.ghost ? 0.5 + Math.sin(elapsed * 4) * 0.15 : Math.abs(Math.sin(elapsed * 10)) * 0.06) + extraY;

        const wrap = tagWrappers[id];
        if (id === myId && viewMode === 'FIRST') {
          wrap.style.display = 'none';
          return;
        }
        const headPos = new THREE.Vector3(mesh.position.x, mesh.position.y + 2.05, mesh.position.z);
        headPos.project(camera);
        if (headPos.z < 1) {
          const sx = (headPos.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-headPos.y * 0.5 + 0.5) * window.innerHeight;
          wrap.style.left = `${sx}px`;
          wrap.style.top = `${sy}px`;
          wrap.style.display = 'flex';
        } else {
          wrap.style.display = 'none';
        }
      });

      // 8) 몬스터 패턴 1 & 2 업데이트 (단발 초고속 러시 / 3~4회 왕복 앰부시)
      if (rushState === 'CHARGING') {
        if (rushTurnPause > 0) {
          rushTurnPause -= dt;
        } else {
          const rushSpeed = rushMode === 'AMBUSH' ? 70 : 62;
          rushMonsterZ += rushDir * rushSpeed * dt;
          rushMesh.position.z = rushMonsterZ;
          cameraShake = Math.max(cameraShake, 0.28);

          const passRoomIdx = Math.round(-rushMonsterZ / ROOM_LENGTH);
          if (roomDataList[passRoomIdx]) {
            roomDataList[passRoomIdx].flickerTimer = Math.max(roomDataList[passRoomIdx].flickerTimer, 0.8);
          }

          if (players[myId] && !hiddenClosetId && !rushHitThisLeg && Math.abs(players[myId].z - rushMonsterZ) < 2.4) {
            rushHitThisLeg = true;
            takeDamage();
          }

          const minBound = -(unlockedDoor + 3) * ROOM_LENGTH - 8;
          const maxBound = 24;

          if ((rushDir === 1 && rushMonsterZ > maxBound) || (rushDir === -1 && rushMonsterZ < minBound)) {
            rushPassesLeft--;
            if (rushPassesLeft > 0) {
              rushDir *= -1;
              rushHitThisLeg = false;
              rushTurnPause = 0.62; // 짧은 턴 대기로 긴장감 극대화
              playAmbushTurnSound();
            } else {
              rushState = 'NONE';
              rushMesh.visible = false;
              if (!chaseActive) {
                document.getElementById('vignette').classList.remove('anomaly', 'ambush');
              }
            }
          }
        }
      }

      // 9) 몬스터 패턴 3: 미로 추격자 업데이트 (컷신 종료 후 궤적 기반 추격)
      if (chaseActive && !cutsceneActive && players[myId]) {
        const me = players[myId];
        chaseHitCooldown = Math.max(0, chaseHitCooldown - dt);

        if (chaseHitCooldown <= 0) {
          const monsterSpeed = 7.15; // 기본 이동속도(7.5)와 아슬아슬한 추격 밸런스
          let targetX = me.x;
          let targetZ = me.z;

          if (playerTrail.length > 0) {
            targetX = playerTrail[0].x;
            targetZ = playerTrail[0].z;
            if (Math.hypot(targetX - chaseMonsterX, targetZ - chaseMonsterZ) < 0.75) {
              playerTrail.shift();
            }
          }

          const dx = targetX - chaseMonsterX;
          const dz = targetZ - chaseMonsterZ;
          const dist = Math.hypot(dx, dz);
          if (dist > 0.01) {
            chaseMonsterX += (dx / dist) * monsterSpeed * dt;
            chaseMonsterZ += (dz / dist) * monsterSpeed * dt;
          }
        }

        chaseMesh.position.set(chaseMonsterX, 0, chaseMonsterZ);
        chaseMesh.rotation.y = elapsed * 2.5;

        const distToPlayer = Math.hypot(me.x - chaseMonsterX, me.z - chaseMonsterZ);
        if (distToPlayer < 16) {
          cameraShake = Math.max(cameraShake, (1 - distToPlayer / 16) * 0.25);
        }

        if (distToPlayer < 1.55 && chaseHitCooldown <= 0) {
          takeDamage();
          chaseHitCooldown = 2.0; // 피격 후 2초 유예로 연속 즉사 방지
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
